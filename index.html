<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="config/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Đường Lên Đỉnh Olympia - Trang Chủ</title>
    <style>
        /* ================= BASE & MENU STYLES ================= */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #153280 0%, #061138 50%, #010414 100%); color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .active-screen { display: flex; }

        /* Setup Screen */
        #setup-screen { justify-content: center; align-items: center; background: rgba(1, 4, 20, 0.95); z-index: 1000; position: absolute; top:0; left:0; }
        .setup-box { background: rgba(21, 50, 128, 0.3); border: 2px solid #f2c94c; padding: 40px; border-radius: 15px; box-shadow: 0 0 40px rgba(242, 201, 76, 0.2); max-width: 90%; text-align: center; backdrop-filter: blur(10px); }
        .setup-box h2 { color: #f2c94c; margin-top: 0; font-size: 2rem; text-transform: uppercase; }
        .setup-box select, .setup-box button { width: 100%; padding: 15px; font-size: 1.5rem; border-radius: 8px; margin: 20px 0; background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid #f2c94c; box-sizing: border-box; }
        .setup-box button { background: #f2c94c; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; border: none; }
        .setup-box button:hover { background: #fff; box-shadow: 0 0 20px #f2c94c; }

        /* Main Menu */
        #main-screen { align-items: center; overflow-y: auto; }
        .logo-container { margin-top: 40px; width: 80px; height: 80px; border-radius: 50%; border: 2px solid #f2c94c; box-shadow: 0 0 20px rgba(242, 201, 76, 0.6); overflow: hidden; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .main-header { margin-top: 20px; margin-bottom: 50px; text-align: center; }
        .main-header h1 { color: #ffffff; font-size: 3rem; margin: 0; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
        .team-info { margin-bottom: 20px; font-size: 1.5rem; color: #e0e0e0; }
        .team-info span { color: #f2c94c; font-weight: bold; text-transform: uppercase; }
        
        /* CHỈNH SỬA GRID THÀNH FLEXBOX ĐỂ BỐ TRÍ 3 TRÊN 2 DƯỚI */
        .menu-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center;
            gap: 30px; 
            width: 95%; 
            max-width: 1000px; /* Mở rộng xíu để chứa 3 item */
            padding-bottom: 40px;
        }
        .menu-item { 
            /* Cấu hình chiều rộng khoảng 33% để hiện 3 cái/hàng, phần dư đẩy item 4, 5 xuống dòng 2 căn giữa */
            width: calc(33.33% - 20px); 
            box-sizing: border-box;
            text-decoration: none; 
            color: white; 
            background: rgba(21, 50, 128, 0.15); 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            border-radius: 20px; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: all 0.3s; 
            cursor: pointer; 
            backdrop-filter: blur(5px);
        }
        .menu-item:hover { transform: scale(1.05); }
        .v1 { border-color: #007bff; } .v2 { border-color: #fd7e14; } .v3 { border-color: #6f42c1; } .v4 { border-color: #dc3545; }
        .round-name { font-size: 0.9rem; color: #a0b0d0; text-transform: uppercase; margin-bottom: 5px; }
        .round-title { font-size: 1.8rem; font-weight: bold; text-align: center; }

        /* ================= CHUNG CHO CÁC VÒNG THI ================= */
        .round-header { padding: 15px 50px; font-size: 2.5rem; font-weight: bold; text-transform: uppercase; color: #ffd700; border-bottom: 3px solid #ffd700; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .logo-link { display: flex; align-items: center; gap: 20px; text-decoration: none; color: #ffd700; cursor: pointer; }
        .logo-img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #ffd700; }
        .team-name-display { color: #56ccf2; font-size: 2.5rem; }
        
        .footer { display: flex; justify-content: space-around; padding: 20px; background: rgba(0,0,0,0.8); border-top: 3px solid #56ccf2; z-index: 10; width: 100%; box-sizing: border-box;}
        .stat-box { display: flex; flex-direction: column; align-items: center; width: 45%; }
        .stat-label { font-size: 1.2rem; color: #ccc; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 4rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); line-height: 1; }
        .timer { color: #ff416c; text-shadow: 0 0 20px rgba(255, 65, 108, 0.8); }

        .input-area { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; align-items: center;}
        .input-area input { font-size: 1.5rem; padding: 12px; border-radius: 8px; border: 2px solid #ffd700; text-align: center; width: 80%; max-width: 400px; outline: none; color: #000; background: #fff; font-weight: bold;}
        .input-area button { font-size: 1.5rem; padding: 12px; background: #ffd700; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 80%; max-width: 400px; color: #000; transition: 0.2s;}
        .input-area button:hover { background: #e6c200; transform: translateY(-2px); }
        .submitted-msg { color: #56ccf2; font-size: 1.5rem; padding: 10px; border: 2px dashed #56ccf2; background: rgba(86, 204, 242, 0.1); border-radius: 8px; text-align: center; width: 80%; max-width: 400px; line-height: 1.5;}

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px; overflow-y: auto; width: 100%; box-sizing: border-box;}
        .question-box { background: rgba(255, 255, 255, 0.1); border: 2px solid #56ccf2; border-radius: 15px; padding: 30px; width: 85%; max-width: 1000px; font-size: 2rem; line-height: 1.6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 20px rgba(86, 204, 242, 0.4); box-sizing: border-box; transition: 0.3s;}

        /* V2 Styles */
        .v2-layout { display: flex; flex-direction: row; flex: 1; padding: 20px; gap: 40px; overflow: hidden; width: 100%; box-sizing: border-box;}
        .left-col { flex: 5; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .puzzle-wrapper { position: relative; width: 100%; max-width: 600px; aspect-ratio: 4/3; background: #000; border: 4px solid #ffd700; border-radius: 10px; overflow: hidden; }
        .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .piece { position: absolute; background: #002244; border: 2px solid #56ccf2; color: #fff; font-size: 4rem; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; z-index: 2; }
        .p1 { top:0; left:0; width:50%; height:50%; } .p2 { top:0; left:50%; width:50%; height:50%; } .p3 { top:50%; left:0; width:50%; height:50%; } .p4 { top:50%; left:50%; width:50%; height:50%; }
        .p5 { top:25%; left:25%; width:50%; height:50%; z-index: 3; border-radius: 50%; background: #001133; border-color: #ff416c; }
        .hide-piece { opacity: 0; pointer-events: none; }
        .right-col { flex: 4; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); border-radius: 15px; border: 1px solid #335577; padding: 20px;}
        
        .cw-row { display: flex; align-items: center; justify-content: flex-end; width: 100%; gap: 10px; margin-bottom: 8px;}
        .cw-char { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle, #56ccf2, #0052cc); border: 1px solid #fff; display: flex; justify-content: center; align-items: center; font-size: 1rem; font-weight: bold; color: white;}
        .cw-label { width: 35px; height: 28px; background: rgba(255,255,255,0.1); border-radius: 6px; border: 1px solid #56ccf2; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.9rem;}
        .cw-row-cnv .cw-char { background: radial-gradient(circle, #ff6b81, #c82333); }

        .subject-tag { color: #ffd700; font-size: 2.2rem; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; }
        .question-text-display { font-size: 2.5rem; font-weight: normal; color: white; margin-bottom: 30px; }
        .waiting-text { font-style: italic; color: #aaaaaa; font-size: 2rem; }

        /* Placeholders for V4 */
        .generic-layout { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        
        /* PHẢN HỒI GIAO DIỆN (RESPONSIVE) */
        @media screen and (max-width: 1024px) {
            .menu-item { width: calc(50% - 15px); } /* Thành 2 cột trên tablet */
        }
        @media screen and (max-width: 768px) {
            .menu-item { width: 100%; max-width: 400px; } /* Thành 1 cột trên điện thoại */
            .v2-layout { flex-direction: column; overflow-y: auto;}
            .round-header { padding: 15px; font-size: 1.5rem; }
            .team-name-display { font-size: 1.5rem; }
            .stat-value { font-size: 2.5rem; }
            .subject-tag { font-size: 1.8rem; }
            .question-text-display { font-size: 2rem; }
            .question-box { font-size: 1.3rem; padding: 20px;}
        }
    </style>
</head>
<body>
    <div id="setup-screen" class="screen active-screen">
        <div class="setup-box">
            <h2>CÀI ĐẶT MÁY TRẠM</h2>
            <select id="init-team-select"><option value="">Đang kết nối dữ liệu...</option></select>
            <button onclick="saveMachineConfig()">XÁC NHẬN</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="logo-container">
            <img src="https://media.leloipt.edu.vn/Media/30_TH1041/Images/footer-logo-leloi83f2a8da-5-e.png" alt="Logo">
        </div>
        <div class="main-header">
            <h1>Chinh Phục Tri Thức</h1>
        </div>
        <div class="team-info">Máy trạm: <span id="display-team-name-menu">...</span></div>
        <div class="menu-grid">
            <a class="menu-item v1" onclick="goToV1()"><span class="round-name">Vòng 1 Riêng</span><span class="round-title">KHỞI ĐỘNG</span></a>
            <a class="menu-item v1" onclick="goToV1_1()"><span class="round-name">Vòng 1 Chung</span><span class="round-title">KHỞI ĐỘNG</span></a>
            <a class="menu-item v2" onclick="goToV2()"><span class="round-name">Vòng 2</span><span class="round-title">VƯỢT CHƯỚNG NGẠI VẬT</span></a>
            <a class="menu-item v3" onclick="goToV3()"><span class="round-name">Vòng 3</span><span class="round-title">TĂNG TỐC</span></a>
            <a class="menu-item v4" onclick="goToV4()"><span class="round-name">Vòng 4</span><span class="round-title">VỀ ĐÍCH</span></a>
        </div>
    </div>

    <div id="v4-screen" class="screen">
        <div class="round-header">
            <a class="logo-link" onclick="switchScreen('main-screen')"><span>◀ QUAY LẠI</span></a>
            <span class="team-name-display" id="display-team-name-v4"></span>
        </div>
        <div class="generic-layout">
            <div class="question-box" id="q-box-v4">
                Khu vực hiển thị gói câu hỏi Vòng 4 (Đang xây dựng logic Backend)
            </div>
        </div>
        <div class="footer">
            <div class="stat-box"><span class="stat-label">ĐIỂM SỐ</span><span class="stat-value" id="current-score-v4">0</span></div>
            <div class="stat-box"><span class="stat-label">THỜI GIAN</span><span class="stat-value timer" id="time-left-v4">15.0</span></div>
        </div>
    </div>

    <script>
        // --- API URLS ---
        const API_URL = "https://script.google.com/macros/s/AKfycbxZqLJ3h3NWPjbc_GvQgoEMUqM8jorcorpHfnzXjP7at4uXLrNl_3tZ81zB6JCyenIP/exec"; 
        const FIREBASE_DIEMSO_URL = "https://cptt-89-default-rtdb.firebaseio.com/diemso.json";
    
        let myMachineTeam = localStorage.getItem("olympia_team");
        let myTeamKey = localStorage.getItem("olympia_team_key") || ""; 
        let currentActiveScreen = "setup-screen";

        window.onload = function() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('team')) {
                    myMachineTeam = urlParams.get('team');
                    localStorage.setItem("olympia_team", myMachineTeam);
                    if(urlParams.get('teamkey')) {
                        myTeamKey = urlParams.get('teamkey');
                        localStorage.setItem("olympia_team_key", myTeamKey);
                    }
                }
            } catch(e) {}

            if (myMachineTeam) {
                applyTeamAndShowMenu(myMachineTeam);
            } else {
                fetchTeams();
            }
        };

        // HÀM CHUYỂN MÀN HÌNH
        function switchScreen(targetScreenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
            document.getElementById(targetScreenId).classList.add('active-screen');
            currentActiveScreen = targetScreenId;
        }

        // HÀM CHUYỂN TRANG SANG FILE VÒNG ĐỘC LẬP (ROUTING LOCAL)
        function goToV1() {
            window.open("vongchoi/vong1_rieng", "_blank");
        }
        function goToV1_1() {
            window.open("vongchoi/vong1_chung", "_blank");
        }
        function goToV2() {
            window.open("vongchoi/vong2", "_blank");
        }
        function goToV3() {
            window.open("vongchoi/vong3", "_blank");
        }
        function goToV4() {
           window.open("vongchoi/vong4", "_blank");
        }

        // KẾT NỐI FIREBASE REALTIME DATABASE LẤY TÊN ĐỘI
        async function fetchTeams() {
            try {
                const res = await fetch(FIREBASE_DIEMSO_URL);
                if (!res.ok) throw new Error("HTTP error " + res.status);
                const data = await res.json();
                
                const select = document.getElementById('init-team-select');
                if (data && typeof data === "object") {
                    select.innerHTML = '<option value="">-- CHỌN ĐỘI CHO MÁY NÀY --</option>';
                    
                    // Lấy các mã đội (doi1, doi2, doi3, doi4...) và sắp xếp đúng thứ tự
                    Object.keys(data).sort().forEach(doiKey => {
                        const team = data[doiKey];
                        if (team && team.tendoi) {
                            // team.tendoi là tên hiển thị (Đội 1, Đội 2...), doiKey là mã (doi1, doi2...)
                            select.innerHTML += `<option value="${team.tendoi}" data-key="${doiKey}">${team.tendoi}</option>`;
                        }
                    });
                } else {
                    select.innerHTML = '<option value="">Không có dữ liệu đội!</option>';
                }
            } catch(e) { 
                console.error("Lỗi lấy danh sách đội từ Firebase:", e); 
                document.getElementById('init-team-select').innerHTML = '<option value="">Lỗi kết nối Firebase!</option>';
            }
        }

        // LƯU ĐỘI VÀO LOCALSTORAGE
        function saveMachineConfig() {
            const select = document.getElementById('init-team-select');
            if(select.selectedIndex <= 0) return alert("Vui lòng chọn 1 đội!");
            const selectedOpt = select.options[select.selectedIndex];
            
            // Lưu tendoi vào localStorage olympia_team
            myMachineTeam = selectedOpt.value;
            // Lưu doi (mã đội) vào localStorage olympia_team_key
            myTeamKey = selectedOpt.getAttribute('data-key');
            
            localStorage.setItem("olympia_team", myMachineTeam); 
            localStorage.setItem("olympia_team_key", myTeamKey);
            
            applyTeamAndShowMenu(myMachineTeam);
        }

        function applyTeamAndShowMenu(team) {
            document.getElementById('display-team-name-menu').innerText = team;
            if (document.getElementById('display-team-name-v4')) {
                document.getElementById('display-team-name-v4').innerText = team;
            }
            switchScreen('main-screen');
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('config/service-worker.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW registration failed:', err));
        }
</script>

</body>
</html>
