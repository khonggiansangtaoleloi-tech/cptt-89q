<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia - Màn Hình Khán Giả Vòng 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* =========================================
           1. HỆ THỐNG MÀU SẮC & BIẾN ĐỒNG BỘ
           ========================================= */
        :root {
            --navy-dark: #000b16;
            --navy: #031c30;
            --blue: #075078;
            --cyan: #75dfff;
            --cyan-soft: rgba(117, 223, 255, 0.25);
            --gold: #ffd34e;
            --gold-light: #ffe899;
            --danger: #ff416c;
            --success: #34e062;
            --success-light: #6bff95;
            --white: #f4faff;
            --muted: #9fb8c9;
            --panel-bg: rgba(2, 20, 38, 0.78);
            --card-bg: linear-gradient(145deg, rgba(6, 52, 82, 0.85), rgba(1, 16, 32, 0.96));
            --glow-cyan: 0 0 18px rgba(117, 223, 255, 0.35);
            --glow-gold: 0 0 18px rgba(255, 211, 78, 0.45);
            --glow-success: 0 0 20px rgba(52, 224, 98, 0.65);
            --glow-danger: 0 0 25px rgba(255, 65, 108, 0.85);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        /* =========================================
           2. RESET & NỀN CHUNG
           ========================================= */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
            background: var(--navy-dark);
        }

        body, button {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            color: var(--white);
            background:
                radial-gradient(ellipse at 50% 0%, rgba(10, 112, 157, 0.65) 0%, rgba(5, 61, 91, 0.45) 35%, transparent 70%),
                linear-gradient(180deg, #06334f 0%, #032238 48%, #000b16 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* =========================================
           3. HEADER, ĐỒNG HỒ & PROGRESS BAR
           ========================================= */
        .header {
            width: 100%;
            min-height: clamp(72px, 10vh, 104px);
            padding: 12px clamp(16px, 3vw, 48px) 18px;
            background: rgba(0, 13, 26, 0.94);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-left {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
        }

        .btn-sound {
            background: rgba(117, 223, 255, 0.1);
            border: 1.5px solid rgba(117, 223, 255, 0.45);
            color: var(--cyan);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: clamp(0.8rem, 1.1vw, 1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-sound:hover {
            background: var(--cyan);
            color: var(--navy-dark);
        }

        .btn-sound.muted {
            border-color: rgba(255, 65, 108, 0.5);
            color: #ff9bb3;
            background: rgba(255, 65, 108, 0.12);
        }

        .header-progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: rgba(255, 211, 78, 0.15);
            overflow: hidden;
        }

        .header-progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffae00, var(--gold), var(--gold-light));
            box-shadow: 0 0 14px rgba(255, 211, 78, 0.8);
            transition: width 0.1s linear, background 0.3s ease;
        }

        .header-progress-bar.paused {
            background: linear-gradient(90deg, #0ea5e9, var(--cyan));
            box-shadow: var(--glow-cyan);
        }

        .header-progress-bar.urgent {
            background: linear-gradient(90deg, #ff1e4d, var(--danger), #ff7597);
            box-shadow: 0 0 18px rgba(255, 65, 108, 0.95);
            animation: urgentBarBlink 0.55s ease-in-out infinite;
        }

        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 4px;
        }

        .header-title {
            font-size: clamp(1.1rem, 2.2vw, 2.1rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(117, 223, 255, 0.6), 0 0 24px rgba(117, 223, 255, 0.25);
            line-height: 1.2;
        }

        #audience-timer {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            font-weight: 800;
            color: var(--gold);
            text-shadow: var(--glow-gold);
            line-height: 1;
            visibility: hidden;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        #audience-timer.timer-paused {
            color: var(--cyan);
            text-shadow: var(--glow-cyan);
        }

        #audience-timer.timer-urgent {
            color: var(--danger);
            font-size: clamp(2.4rem, 4.5vw, 4rem);
            text-shadow: var(--glow-danger), 0 0 45px rgba(255, 65, 108, 0.6);
            animation: urgentBlink 0.55s ease-in-out infinite;
        }

        @keyframes urgentBlink {
            0%, 100% { opacity: 1; transform: scale(1.12); }
            50% { opacity: 0.35; transform: scale(0.96); }
        }

        @keyframes urgentBarBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            color: var(--gold);
            text-decoration: none;
            font-size: clamp(0.85rem, 1.3vw, 1.35rem);
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            padding: 8px 16px;
            border: 1.5px solid rgba(255, 211, 78, 0.45);
            border-radius: 8px;
            background: rgba(255, 211, 78, 0.08);
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .btn-next:hover {
            color: var(--navy-dark);
            background: var(--gold);
            box-shadow: var(--glow-gold);
            transform: translateY(-2px);
        }

        /* =========================================
           4. BỐ CỤC CHÍNH (2 CỘT CÂN ĐỐI)
           ========================================= */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 1840px;
            padding: clamp(14px, 2vw, 28px);
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr);
            gap: clamp(16px, 2vw, 28px);
            align-items: stretch;
        }

        .left-panel,
        .right-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 1.6vw, 22px);
        }

        .right-panel {
            background: var(--panel-bg);
            border: 1.5px solid var(--cyan-soft);
            border-radius: var(--radius-lg);
            padding: clamp(14px, 1.8vw, 24px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* =========================================
           5. KHUNG HÌNH ẢNH FULL KHUNG & MẢNH GHÉP
           ========================================= */
        .puzzle-wrapper {
            width: 100%;
            background: rgba(0, 17, 33, 0.88);
            border: 2px solid var(--cyan);
            padding: 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--glow-cyan);
            transition: all 0.45s ease-in-out;
        }

        .puzzle-wrapper.zoomed {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(88vw, 960px);
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 12px;
            border-color: var(--success);
            box-shadow: 0 0 60px rgba(52, 224, 98, 0.65), 0 0 120px rgba(0, 0, 0, 0.9);
            background: rgba(0, 11, 22, 0.98);
        }

        .puzzle-box {
            container-type: inline-size;
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #062b42;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }

        .piece {
            position: absolute;
            width: 50%;
            height: 50%;
            background: linear-gradient(145deg, #085b88, #03243d);
            border: 1px solid var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 11cqi, 7rem);
            font-weight: 900;
            color: var(--gold);
            text-shadow: var(--glow-gold);
            transition: opacity 0.6s ease;
            z-index: 2;
        }

        .piece.revealed {
            opacity: 0;
            pointer-events: none;
        }

        .p1 { top: 0; left: 0; }
        .p2 { top: 0; left: 50%; }
        .p3 { top: 50%; left: 0; }
        .p4 { top: 50%; left: 50%; }

        .piece-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 82%;
            width: auto;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0d7ab3, #022038 78%);
            border: 4px solid var(--gold);
            box-shadow: 0 0 28px rgba(255, 211, 78, 0.6), inset 0 0 20px rgba(117, 223, 255, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--gold-light);
            font-weight: 900;
            font-size: clamp(1.4rem, 6.5cqi, 3.2rem);
            line-height: 1.15;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: var(--glow-gold);
            z-index: 3;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .piece-center.revealed {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.7);
            pointer-events: none;
        }

        .piece-dead {
            background: repeating-linear-gradient(
                45deg,
                #101e29 0,
                #101e29 10px,
                #192b38 10px,
                #192b38 20px
            ) !important;
            color: #50616d !important;
            border-color: #364957 !important;
            filter: grayscale(100%);
            opacity: 0.98 !important;
            box-shadow: none !important;
            text-shadow: none !important;
            pointer-events: none;
        }

        .zoom-answer-banner {
            display: none;
            margin-top: 14px;
            padding: 14px 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(52, 224, 98, 0.22), rgba(4, 52, 34, 0.92));
            border: 2px solid var(--success);
            color: var(--success-light);
            font-size: clamp(1.5rem, 3.2vw, 3rem);
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            text-shadow: var(--glow-success);
            letter-spacing: 1px;
        }

        .puzzle-wrapper.zoomed .zoom-answer-banner {
            display: block;
        }

        /* =========================================
           6. BẢNG CÂU HỎI & ĐÁP ÁN
           ========================================= */
        .question-board {
            container-type: inline-size;
            flex: 1;
            width: 100%;
            min-height: clamp(200px, 26vh, 300px);
            background: linear-gradient(135deg, rgba(10, 91, 132, 0.8), rgba(2, 28, 50, 0.96));
            border: 2px solid var(--cyan);
            border-radius: var(--radius-lg);
            padding: 16px 26px 20px;
            box-shadow: var(--glow-cyan), inset 0 0 20px rgba(117, 223, 255, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 10px;
            overflow-y: auto;
        }

        .q-placeholder {
            margin: auto 0;
            text-align: center;
            color: var(--muted);
            font-style: italic;
            font-size: clamp(1.35rem, 3.4cqi, 2.4rem);
        }

        .q-subject {
            text-align: center;
            color: var(--gold);
            font-size: clamp(1rem, 2.4cqi, 1.55rem);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: var(--glow-gold);
            flex-shrink: 0;
        }

        .q-subject + .q-answer-reveal {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.8rem, 9cqi, 6.2rem);
            letter-spacing: 2px;
        }

        .q-direct-badge {
            align-self: center;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(117, 223, 255, 0.16);
            border: 1.5px solid var(--cyan);
            color: var(--cyan);
            font-size: clamp(0.85rem, 1.8cqi, 1.15rem);
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .q-text {
            width: 100%;
            margin: auto 0;
            color: var(--white);
            font-size: clamp(1.55rem, 4cqi, 2.85rem);
            line-height: 1.38;
            font-weight: 700;
            text-align: justify;
            text-align-last: center;
        }

        .q-answer-reveal {
            text-align: center;
            margin-top: 8px;
            padding-top: 12px;
            width: 100%;
            border-top: 2px dashed var(--success);
            font-size: clamp(2rem, 5.5cqi, 4.2rem);
            font-weight: 900;
            color: var(--success-light);
            text-shadow: var(--glow-success);
            text-transform: uppercase;
            line-height: 1.15;
            flex-shrink: 0;
        }

        /* =========================================
           7. BẢNG TỪ KHÓA HÀNG NGANG
           ========================================= */
        .words-board {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.1vw, 14px);
            padding: 6px 4px;
            overflow-x: auto;
        }

        .word-row {
            display: flex;
            align-items: center;
            gap: clamp(5px, 0.6vw, 8px);
            transition: opacity 0.3s ease;
        }

        .word-row.dead {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        .row-label {
            background: linear-gradient(135deg, #08729f, #032f4d);
            border: 1.5px solid var(--cyan);
            color: var(--gold);
            min-width: clamp(30px, 2.8vw, 40px);
            height: clamp(30px, 2.8vw, 40px);
            border-radius: 8px;
            font-weight: 900;
            font-size: clamp(0.9rem, 1.1vw, 1.15rem);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .circle {
            width: clamp(28px, 2.8vw, 42px);
            height: clamp(28px, 2.8vw, 42px);
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: clamp(0.9rem, 1.25vw, 1.3rem);
            text-transform: uppercase;
            box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.35), 0 0 10px rgba(117, 223, 255, 0.2);
        }

        .circle.blue {
            background: radial-gradient(circle at 30% 30%, #8be9ff, #0879aa);
            color: #001b2c;
        }

        .circle.empty-revealed {
            background: radial-gradient(circle at 30% 30%, #ffffff, #b9eafa);
            color: #03243b;
            box-shadow: 0 0 14px rgba(117, 223, 255, 0.55);
        }

        /* =========================================
           8. BẢNG CHƯỚNG NGẠI VẬT
           ========================================= */
        .cnv-board {
            container-type: inline-size;
            background: linear-gradient(135deg, rgba(8, 83, 121, 0.5), rgba(0, 18, 34, 0.92));
            border: 2px dashed var(--cyan);
            border-radius: var(--radius-md);
            padding: clamp(12px, 1.5vw, 20px) 16px;
            font-size: clamp(1rem, 2.8cqi, 2.2rem);
            font-weight: 900;
            color: var(--white);
            text-transform: uppercase;
            text-align: center;
            box-shadow: var(--glow-cyan);
        }

        .cnv-highlight {
            color: var(--cyan);
            font-size: clamp(1.25rem, 3.6cqi, 2.8rem);
            text-shadow: var(--glow-cyan);
        }

        .cnv-revealed {
            color: var(--success-light);
            font-size: clamp(1.3rem, 3.8cqi, 3rem);
            text-shadow: var(--glow-success);
        }

        /* =========================================
           9. BẢNG ĐIỂM 4 ĐỘI + HIỂN THỊ ĐÁP ÁN ĐỒNG BỘ
           ========================================= */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(10px, 1.2vw, 16px);
            flex: 1;
        }

        .team-card {
            container-type: inline-size;
            background: var(--card-bg);
            border: 2px solid rgba(117, 223, 255, 0.45);
            border-radius: var(--radius-md);
            padding: clamp(10px, 1.2vw, 16px);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .team-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--blue), var(--cyan), var(--gold));
        }

        .team-card.score-up {
            background: linear-gradient(145deg, rgba(22, 163, 74, 0.72), rgba(5, 46, 22, 0.96));
            border-color: var(--success);
            box-shadow: 0 0 30px rgba(52, 224, 98, 0.8), inset 0 0 24px rgba(52, 224, 98, 0.35);
            transform: scale(1.03);
        }

        .team-card.score-down {
            background: linear-gradient(145deg, rgba(220, 38, 38, 0.72), rgba(69, 10, 10, 0.96));
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.85), inset 0 0 24px rgba(255, 65, 108, 0.35);
            transform: scale(0.98);
        }

        .team-name {
            color: var(--gold);
            font-size: clamp(0.95rem, 6cqi, 1.9rem);
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: var(--glow-gold);
            line-height: 1.15;
        }

        .team-score {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            font-size: clamp(2.4rem, 16cqi, 4.4rem);
            color: var(--gold-light);
            font-weight: 800;
            margin: 0;
            line-height: 1;
            text-shadow: var(--glow-gold);
        }

        .team-answer-box {
            margin-top: 0;
            padding: 8px 14px;
            background: rgba(117, 223, 255, 0.08);
            border: 1.5px solid rgba(117, 223, 255, 0.35);
            border-radius: 8px;
            min-height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .team-answer-box.has-answer {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: rgba(52, 224, 98, 0.14);
            border-color: rgba(52, 224, 98, 0.65);
        }

        .team-answer-box.no-answer {
            background: rgba(255, 65, 108, 0.18);
            border-color: var(--danger);
            box-shadow: inset 0 0 14px rgba(255, 65, 108, 0.25);
        }

        .team-ans-text {
            color: var(--white);
            font-weight: 900;
            font-size: clamp(1.15rem, 7cqi, 2rem);
            text-transform: uppercase;
            text-align: left;
            line-height: 1.2;
            word-break: break-word;
        }

        .team-ans-locked {
            color: var(--success-light);
            font-weight: 800;
            font-size: clamp(0.95rem, 5.2cqi, 1.45rem);
            text-transform: uppercase;
            text-align: left;
            letter-spacing: 0.5px;
        }

        .team-ans-empty {
            color: var(--muted);
            font-weight: 600;
            font-style: italic;
            font-size: clamp(0.9rem, 4.5cqi, 1.2rem);
            text-align: center;
        }

        .team-ans-timeout {
            color: #ff7597;
            font-weight: 900;
            font-size: clamp(1.05rem, 6cqi, 1.65rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }

        .team-ans-time {
            font-family: 'JetBrains Mono', monospace;
            color: var(--gold);
            font-size: clamp(0.95rem, 5cqi, 1.4rem);
            font-weight: 800;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* =========================================
           10. FIX KHUNG VỪA KHÍT 100VH TRÊN DESKTOP
           ========================================= */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--navy-dark); }
        ::-webkit-scrollbar-thumb { background: #08739c; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        @media (min-width: 1025px) {
            html, body {
                height: 100vh;
                overflow: hidden;
            }

            .header {
                min-height: 74px;
                padding: 8px 32px 14px;
                flex-shrink: 0;
            }

            .main-content {
                flex: 1;
                min-height: 0;
                padding: 14px 24px 18px;
                overflow: hidden;
            }

            .left-panel,
            .right-panel {
                min-height: 0;
                height: 100%;
                gap: 12px;
            }

            .puzzle-wrapper:not(.zoomed) {
                flex: 0 0 auto;
                padding: 0;
            }

            .puzzle-wrapper:not(.zoomed) .puzzle-box {
                width: 100%;
                height: 44vh;
                aspect-ratio: auto;
                margin: 0;
            }

            .question-board {
                flex: 1;
                min-height: 0;
            }

            .right-panel {
                padding: 14px 18px;
                gap: 10px;
            }

            .words-board {
                gap: 7px;
                padding: 2px 0;
                flex-shrink: 0;
            }

            .circle, .row-label {
                width: clamp(26px, 2.3vw, 36px);
                height: clamp(26px, 2.3vw, 36px);
                min-width: clamp(26px, 2.3vw, 36px);
                font-size: clamp(0.85rem, 1.05vw, 1.1rem);
            }

            .cnv-board {
                padding: 10px 14px;
                flex-shrink: 0;
            }

            .teams-grid {
                flex: 1;
                min-height: 0;
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .team-card {
                padding: 10px 12px;
            }

            .team-answer-box {
                min-height: 44px;
                padding: 6px 8px;
            }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .puzzle-wrapper {
                max-width: 680px;
                margin: 0 auto;
            }
        }

        @media (max-width: 640px) {
            .header {
                grid-template-columns: auto 1fr auto;
                gap: 8px;
            }
            .teams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button id="btn-sound-toggle" class="btn-sound" onclick="toggleSound()">🔊 Âm thanh: BẬT</button>
        </div>
        <div class="header-center">
            <span class="header-title">CHINH PHỤC TRI THỨC - VÒNG 2</span>
            <div id="audience-timer">30.0</div>
        </div>
        <div class="header-right">
            <a class="btn-next" onclick="window.open('../vong3', '_blank')">QUA VÒNG 3 ▶</a>
        </div>

        <div class="header-progress-track">
            <div id="timer-progress-bar" class="header-progress-bar"></div>
        </div>
    </header>

    <main class="main-content" id="main-content">
        <section class="left-panel">
            <div class="puzzle-wrapper" id="puzzle-wrapper">
                <div class="puzzle-box" id="puzzle-img">
                    <div id="piece-1" class="piece p1">1</div>
                    <div id="piece-2" class="piece p2">2</div>
                    <div id="piece-3" class="piece p3">3</div>
                    <div id="piece-4" class="piece p4">4</div>
                    <div id="piece-5" class="piece-center">TRUNG<br>TÂM</div>
                </div>
                <div id="zoom-answer-banner" class="zoom-answer-banner"></div>
            </div>

            <div class="question-board" id="q-board">
                <div class="q-placeholder">Đang kết nối máy chủ...</div>
            </div>
        </section>

        <section class="right-panel">
            <div class="words-board" id="words-board"></div>
            <div class="cnv-board" id="cnv-board">ĐANG TẢI DỮ LIỆU...</div>
            <div class="teams-grid" id="teams-grid"></div>
        </section>
    </main>

    <script>
        // ==========================================
// ĐỒNG BỘ GIỜ CHUẨN VỚI MÁY CHỦ FIREBASE
// ==========================================
let serverTimeOffset = 0;

function getServerNow() {
    return Date.now() + serverTimeOffset;
}

async function syncServerClock(fbBaseUrl) {
    if (!fbBaseUrl) return;
    const clientId = "c_" + Math.random().toString(36).slice(2, 10);
    const url = `${fbBaseUrl}/_clock_sync/${clientId}.json`;
    try {
        const t0 = Date.now();
        const res = await fetch(url, {
            method: "PUT",
            body: JSON.stringify({ ".sv": "timestamp" })
        });
        const serverTs = await res.json();
        const t1 = Date.now();
        if (typeof serverTs === "number") {
            serverTimeOffset = serverTs - Math.round((t0 + t1) / 2);
        }
        fetch(url, { method: "DELETE" }).catch(() => {});
    } catch (e) {
        console.warn("Không thể đồng bộ giờ máy chủ:", e);
    }
}

        // ==========================================
        // 1. CẤU HÌNH FIREBASE & ÂM THANH VÒNG 2
        // ==========================================
        const apiUrlHost = "../../";
        const FB = {};

        const AUDIO_DIR = "../../sound_effect/";
        const SOUNDS = {
            welcome: new Audio(`${AUDIO_DIR}welcome.mp3`),
            timer30: new Audio(`${AUDIO_DIR}sound30s.mp3`),
            timer50: new Audio(`${AUDIO_DIR}50s.mp3`)
        };
        Object.values(SOUNDS).forEach(a => { a.preload = "auto"; });

        let isSoundMuted = false;
        let lastPlayedTimerKey = "";
        let lastAnswerSoundKey = "";

        function toggleSound() {
            isSoundMuted = !isSoundMuted;
            const btn = document.getElementById('btn-sound-toggle');
            if (isSoundMuted) {
                btn.innerText = "🔇 Âm thanh: TẮT";
                btn.classList.add('muted');
                stopAllSounds();
            } else {
                btn.innerText = "🔊 Âm thanh: BẬT";
                btn.classList.remove('muted');
            }
        }

        function stopAllSounds() {
            Object.values(SOUNDS).forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
        }

        function stopTimerSound() {
            SOUNDS.timer30.pause();
            SOUNDS.timer30.currentTime = 0;
        }

        function playSound(key, restart = true) {
            if (isSoundMuted || !SOUNDS[key]) return;
            try {
                if (restart) SOUNDS[key].currentTime = 0;
                SOUNDS[key].play().catch(() => {});
            } catch (e) {}
        }

        async function loadFbConfig() {
            try {
                const res = await fetch(`${apiUrlHost}api/vong2.json?_t=${Date.now()}`);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const cfg = await res.json();
                const url = (cfg.api_url || "").trim();
                if (!url) throw new Error("Thiếu api_url trong api/vong2.json");

                FB.vong2 = url.replace(/\.json$/, "").replace(/\/$/, "");
                FB.diemso = FB.vong2.replace(/\/vong2$/, "") + "/diemso";
            } catch (e) {
                console.error("Lỗi đọc cấu hình Firebase:", e);
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function fbToObj(x) {
            if (Array.isArray(x)) {
                const o = {};
                x.forEach((v, i) => { if (v !== null && v !== undefined) o[String(i)] = v; });
                return o;
            }
            return x || {};
        }

        function isCenterQuestion(qId) {
            if (!qId) return false;
            const s = String(qId).trim().toLowerCase();
            return (s === "5" || s === "cnv" || s === "trungtam");
        }

        // ==========================================
        // 2. BIẾN TRẠNG THÁI ĐỒNG BỘ VỚI ADMIN
        // ==========================================
        let fbCauHoiHienTai = null;
        let fbShowAnswer = false;
        let isTimeUpV2 = false;
        window.fbBlurredArr = [];

        let globalCauHoiV2 = {};
        let globalTrangThai = {};
        let globalMatchState = {};

        let endTimeTimestampV2 = null;
        let timerPausedV2 = false;
        let timerRemainingV2 = 0;
        let lastQuestionIdV2 = null;

        let currentScores = {};
        let scoreFlashState = {};
        let scoreFlashTimers = {};

        let wasBravoTriggered = false;
        let isBravoFinished = false;
        let lastBravoKey = "";

        window.teamNamesMapping = {};
        window.activeTeams = [];

        // ==========================================
        // 3. TỰ ĐỘNG PHÁT NHẠC CHÀO MỪNG & BRAVO
        // ==========================================
        function checkAndTriggerAnswerSound() {
            if (!fbCauHoiHienTai || !fbShowAnswer) {
                lastAnswerSoundKey = "";
                return;
            }

            const curKey = `${fbCauHoiHienTai}_${globalTrangThai.answerTrigger || ""}`;
            if (isCenterQuestion(fbCauHoiHienTai)) return;

            if (lastAnswerSoundKey !== curKey) {
                lastAnswerSoundKey = curKey;
                stopTimerSound();
                playSound('welcome', true);
            }
        }

        function checkAndTriggerBravo() {
            const isCenter = isCenterQuestion(fbCauHoiHienTai);
            if (!isCenter || !fbShowAnswer) {
                wasBravoTriggered = false;
                isBravoFinished = false;
                lastBravoKey = "";
                return;
            }

            const bravoKey = `${fbCauHoiHienTai}_${globalTrangThai.answerTrigger || ""}`;
            if (!wasBravoTriggered || lastBravoKey !== bravoKey) {
                wasBravoTriggered = true;
                isBravoFinished = false;
                lastBravoKey = bravoKey;
                const q5 = globalCauHoiV2['5'] || globalCauHoiV2[fbCauHoiHienTai];
                const ansText = (q5 && q5.dapAn) ? q5.dapAn : "";
                triggerFireworksAndZoom(ansText);
            }
        }

        function triggerFireworksAndZoom(answerText = "") {
            const puzzleWrapper = document.getElementById('puzzle-wrapper');
            const zoomBanner = document.getElementById('zoom-answer-banner');

            const puzzleImg = document.getElementById('puzzle-img');
            if (globalTrangThai.linkAnh) {
                puzzleImg.style.backgroundImage = `url('${globalTrangThai.linkAnh}')`;
            }
            ['1', '2', '3', '4', '5'].forEach(p => {
                const el = document.getElementById(`piece-${p}`);
                if (el) el.classList.add('revealed');
            });

            if (zoomBanner) {
                zoomBanner.innerText = answerText ? `ĐÁP ÁN: ${answerText.toUpperCase()}` : "CHÚC MỪNG!";
            }

            puzzleWrapper.classList.add('zoomed');
            stopTimerSound();
            playSound('welcome', true);

            const end = Date.now() + 2500;
            (function frame() {
                confetti({
                    particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 10000,
                    colors: ['#34e062', '#ffd34e', '#75dfff', '#ff416c', '#ffffff']
                });
                confetti({
                    particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 10000,
                    colors: ['#34e062', '#ffd34e', '#75dfff', '#ff416c', '#ffffff']
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            setTimeout(() => {
                puzzleWrapper.classList.remove('zoomed');
                isBravoFinished = true;
                renderQBoard();
            }, 4000);
        }

        // ==========================================
        // 4. ĐỒNG HỒ KHÁN GIẢ + SOUND30S.MP3
        // ==========================================
        function updateAudienceTimer() {
            const timerEl = document.getElementById('audience-timer');
            const progressBar = document.getElementById('timer-progress-bar');
            if (!timerEl) return;

            const curQ = globalTrangThai ? (globalTrangThai.cauHoiHienTai || "") : (fbCauHoiHienTai || "");
            if (!curQ) {
                if (timerEl.style.visibility !== "hidden") {
                    timerEl.style.visibility = "hidden";
                    timerEl.innerText = "30.0";
                    timerEl.className = "";
                }
                if (progressBar) {
                    progressBar.style.width = "100%";
                    progressBar.className = "header-progress-bar";
                }
                stopTimerSound();
                lastPlayedTimerKey = "";
                return;
            }

            if (timerEl.style.visibility !== "visible") {
                timerEl.style.visibility = "visible";
            }

            const dist = timerPausedV2
                ? Math.max(0, timerRemainingV2)
                : (endTimeTimestampV2 ? endTimeTimestampV2 - getServerNow() : 0);
                
            if (dist <= 0) {
                timerEl.innerText = "0.0";
                timerEl.className = "";
                if (progressBar) {
                    progressBar.style.width = "0%";
                    progressBar.className = "header-progress-bar";
                }

                stopTimerSound();

                if (!isTimeUpV2) {
                    isTimeUpV2 = true;
                    renderQBoard();
                    renderTeamsInstantly();
                    checkAndTriggerAnswerSound();
                    checkAndTriggerBravo();
                }
            } else if (timerPausedV2) {
                timerEl.innerText = `⏸ ${(dist / 1000).toFixed(1)}`;
                timerEl.className = "timer-paused";
                const percent = Math.max(0, Math.min(100, (dist / 30000) * 100));
                if (progressBar) {
                    progressBar.style.width = percent + "%";
                    progressBar.className = "header-progress-bar paused";
                }
                if (!SOUNDS.timer30.paused) {
                    SOUNDS.timer30.pause();
                }
            } else {
                timerEl.innerText = dist > 30000 ? "30.0" : (dist / 1000).toFixed(1);
                const percent = Math.max(0, Math.min(100, (dist / 30000) * 100));
                if (progressBar) {
                    progressBar.style.width = percent + "%";
                }

                if (fbShowAnswer) {
                    stopTimerSound();
                } else if (!isSoundMuted) {
                    const timerKey = `${curQ}_${endTimeTimestampV2}`;
                    if (lastPlayedTimerKey !== timerKey) {
                        lastPlayedTimerKey = timerKey;
                        const elapsedSec = Math.max(0, (30000 - dist) / 1000);
                        const duration = Number.isFinite(SOUNDS.timer30.duration) ? SOUNDS.timer30.duration : 30;
                        const startOffset = Math.max(0, duration - 30);
                        try {
                            SOUNDS.timer30.currentTime = startOffset + elapsedSec;
                            SOUNDS.timer30.play().catch(() => {});
                        } catch (e) {}
                    }
                }

                if (dist <= 5000) {
                    timerEl.className = "timer-urgent";
                    if (progressBar) progressBar.className = "header-progress-bar urgent";
                } else {
                    timerEl.className = "";
                    if (progressBar) progressBar.className = "header-progress-bar";
                }
            }
        }

        // ==========================================
        // 5. DANH SÁCH ĐỘI & ĐIỂM SỐ
        // ==========================================
        function triggerScoreFlash(col, type) {
            scoreFlashState[col] = type;
            if (scoreFlashTimers[col]) clearTimeout(scoreFlashTimers[col]);
            scoreFlashTimers[col] = setTimeout(() => {
                delete scoreFlashState[col];
                const card = document.getElementById(`team-card-${col}`);
                if (card) card.classList.remove('score-up', 'score-down');
            }, 2000);
        }

        async function fetchTeamNames() {
            if (!FB.diemso) return;
            try {
                const data = (await (await fetch(`${FB.diemso}.json?_t=${Date.now()}`)).json()) || {};
                window.teamNamesMapping = {};
                window.activeTeams = [];

                Object.keys(data)
                    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
                    .forEach(col => {
                        const item = data[col] || {};
                        window.teamNamesMapping[col] = item.tendoi || col;
                        window.activeTeams.push(col);
                        currentScores[col] = parseInt(item.diem) || 0;
                    });
                renderTeamsInstantly();
            } catch (err) {
                console.error("Lỗi lấy danh sách đội:", err);
            }
        }

        async function fetchScoresFromAPI() {
            if (!FB.diemso || window.activeTeams.length === 0) return;
            try {
                const data = (await (await fetch(`${FB.diemso}.json?_t=${Date.now()}`)).json()) || {};
                let hasChanged = false;
                window.activeTeams.forEach(col => {
                    const item = data[col];
                    if (item) {
                        if (item.tendoi && window.teamNamesMapping[col] !== item.tendoi) {
                            window.teamNamesMapping[col] = item.tendoi;
                            hasChanged = true;
                        }
                        if (item.diem !== undefined && item.diem !== null) {
                            const newScore = parseInt(item.diem) || 0;
                            const oldScore = currentScores[col];
                            if (oldScore !== undefined && oldScore !== newScore) {
                                currentScores[col] = newScore;
                                triggerScoreFlash(col, newScore > oldScore ? 'up' : 'down');
                                hasChanged = true;
                            }
                        }
                    }
                });
                if (hasChanged) renderTeamsInstantly();
            } catch (err) {
                console.error("Lỗi fetch điểm:", err);
            }
        }

        // ==========================================
        // 6. TRẠNG THÁI GAME VÒNG 2
        // ==========================================
        async function fetchVong2Data() {
            if (!FB.vong2) return;
            try {
                const db = (await (await fetch(`${FB.vong2}.json?_t=${Date.now()}`)).json()) || {};

                let dsch = fbToObj(db.danhSachCauHoi);

                if (db.question_bank) {
                    const hn = fbToObj(db.question_bank.hangngang);
                    Object.keys(hn).forEach(k => {
                        const q = hn[k] || {};
                        const dapAn = q.dapan || q.dapAn || q.danan || "";
                        const cleanDapAn = String(dapAn).normalize('NFC').trim();
                        dsch[k] = {
                            id: k,
                            noiDung: q.cauhoi || q.noiDung || "",
                            dapAn: cleanDapAn,
                            soKyTu: Number(q.sokytu || q.soKyTu) || cleanDapAn.replace(/\s/g, "").length || 0
                        };
                    });
                }

                let tuKhoaFB = (db.question_bank && db.question_bank.tukhoa) ? db.question_bank.tukhoa : "";
                if (!tuKhoaFB) {
                    const firstRow = Object.values(fbToObj(db)).find(r => r && typeof r === "object" && r.tukhoa);
                    if (firstRow) tuKhoaFB = firstRow.tukhoa;
                }

                if (tuKhoaFB || (db.question_bank && db.question_bank.cauhoi_trungtam)) {
                    const cleanTuKhoa = String(tuKhoaFB).normalize('NFC').trim();
                    dsch["5"] = {
                        id: "5",
                        noiDung: (db.question_bank && db.question_bank.cauhoi_trungtam) || "Hãy cho biết đây là chướng ngại vật nào?",
                        dapAn: cleanTuKhoa,
                        soKyTu: Number(db.question_bank && db.question_bank.so_kytu) || cleanTuKhoa.replace(/\s/g, "").length
                    };
                }

                if (db.question_bank && db.question_bank.link_anh && (!db.trangThai || !db.trangThai.linkAnh)) {
                    db.trangThai = db.trangThai || {};
                    db.trangThai.linkAnh = db.question_bank.link_anh;
                }

                globalCauHoiV2 = dsch;
                const state = db.trangThai || {};
                globalTrangThai = state;
                globalMatchState = db.match_state || {};

                fbCauHoiHienTai = state.cauHoiHienTai || "";
                const showFromMatchState = Boolean(globalMatchState.config && globalMatchState.config.show_dapan === true);
                fbShowAnswer = (state.showAnswer === true || state.showAnswer === "true" || showFromMatchState);

                if (state.blurredPieces !== undefined) {
                    window.fbBlurredArr = state.blurredPieces
                        ? state.blurredPieces.toString().split(',').filter(x => x !== "")
                        : [];
                }
                const blurredArr = window.fbBlurredArr;

                if (!fbCauHoiHienTai) {
                    endTimeTimestampV2 = null;
                    timerPausedV2 = false;
                    timerRemainingV2 = 0;
                    lastQuestionIdV2 = null;
                    isTimeUpV2 = false;
                } else {
                    if (fbCauHoiHienTai !== lastQuestionIdV2) {
                        lastQuestionIdV2 = fbCauHoiHienTai;
                        isTimeUpV2 = false;
                    }
                    timerPausedV2 = (state.timerPaused === true || state.timerPaused === "true");
                    if (timerPausedV2) {
                        timerRemainingV2 = Number(state.timerRemaining) || 0;
                    } else if (state.timerEndTime) {
                        endTimeTimestampV2 = Number(state.timerEndTime);
                    } else if (!endTimeTimestampV2) {
                endTimeTimestampV2 = getServerNow() + 30000;                    }
                }

                ['1', '2', '3', '4'].forEach(p => {
                    const el = document.getElementById(`piece-${p}`);
                    if (el) {
                        const isDead = blurredArr.includes(p);
                        const isRev = (state['manh' + p] === true || state['manh' + p] === "true");
                        const deadCls = (isDead && !isRev) ? 'piece-dead' : '';
                        el.className = `piece p${p} ${isRev ? 'revealed' : ''} ${deadCls}`.trim();
                    }
                });

                const p5El = document.getElementById('piece-5');
                if (p5El) {
                    const isRev5 = (state['manh5'] === true || state['manh5'] === "true");
                    const isDead5 = blurredArr.includes('5') || blurredArr.includes('CNV') || blurredArr.includes('TRUNGTAM');
                    const deadCls5 = (isDead5 && !isRev5) ? 'piece-dead' : '';
                    p5El.className = `piece-center ${isRev5 ? 'revealed' : ''} ${deadCls5}`.trim();
                }

                checkAndTriggerAnswerSound();
                checkAndTriggerBravo();
                processAudienceData();
            } catch (err) {
                console.error("Lỗi fetch trạng thái game:", err);
            }
        }

        // ==========================================
        // 7. XỬ LÝ HIỂN THỊ DỮ LIỆU KHÁN GIẢ
        // ==========================================
        function processAudienceData() {
            if (!globalTrangThai || Object.keys(globalTrangThai).length === 0) return;

            const puzzleImg = document.getElementById('puzzle-img');
            if (globalTrangThai.linkAnh) {
                puzzleImg.style.backgroundImage = `url('${globalTrangThai.linkAnh}')`;
            }

            renderQBoard();

            const wordsBoard = document.getElementById('words-board');
            let wordsHtml = "";
            const blurredArr = window.fbBlurredArr;

            for (let i = 1; i <= 4; i++) {
                const qData = globalCauHoiV2[i];
                if (!qData) continue;

                const id = i.toString();
                const answerStr = qData.dapAn ? qData.dapAn.toString().normalize('NFC').toUpperCase().replace(/\s/g, '') : "";
                const charsCount = Number(qData.soKyTu) || answerStr.length || 0;
                const isRevealed = (globalTrangThai['manh' + id] === true || globalTrangThai['manh' + id] === "true")
                    || (fbShowAnswer && String(fbCauHoiHienTai) === id);

                let circlesHtml = "";
                for (let c = 0; c < charsCount; c++) {
                    let letter = "", extraClass = "";
                    if (isRevealed) {
                        letter = answerStr[c] || "";
                        extraClass = "empty-revealed";
                    }
                    circlesHtml += `<div class="circle blue ${extraClass}">${escapeHtml(letter)}</div>`;
                }

                const isRowDead = blurredArr.includes(id);
                wordsHtml += `<div class="word-row ${isRowDead ? 'dead' : ''}"><span class="row-label">${id}</span>${circlesHtml}</div>`;
            }
            wordsBoard.innerHTML = wordsHtml;

            const cnvBoard = document.getElementById('cnv-board');
            const q5Data = globalCauHoiV2['5'];
            const activeQ = globalCauHoiV2[String(fbCauHoiHienTai)] || q5Data;
            const isCenterDone = isCenterQuestion(fbCauHoiHienTai) && fbShowAnswer;
            const hasSelectedQuestion = Boolean(fbCauHoiHienTai && String(fbCauHoiHienTai).trim() !== "");

            if (!hasSelectedQuestion && !isCenterDone) {
                cnvBoard.innerHTML = `<span style="color: var(--muted);">CHƯỚNG NGẠI VẬT: ĐANG CHỜ CHỌN CÂU HỎI...</span>`;
            } else if (activeQ && activeQ.dapAn) {
                const activeAnsStr = activeQ.dapAn.toString().normalize('NFC').toUpperCase();
                const charCount = Number(activeQ.soKyTu) || activeAnsStr.replace(/\s/g, '').length;

                if (isCenterDone && q5Data && q5Data.dapAn) {
                    const cnvAnsStr = q5Data.dapAn.toString().normalize('NFC').toUpperCase();
                    cnvBoard.innerHTML = `<span style="color: var(--gold);">CHƯỚNG NGẠI VẬT:</span> <span class="cnv-revealed">${escapeHtml(cnvAnsStr)}</span>`;
                } else {
                    cnvBoard.innerHTML = `CHƯỚNG NGẠI VẬT GỒM: <span class="cnv-highlight">${charCount} KÝ TỰ</span>`;
                }
            } else {
                cnvBoard.innerHTML = `<span style="color: var(--muted);">CHƯA CÓ DỮ LIỆU CHƯỚNG NGẠI VẬT</span>`;
            }

            renderTeamsInstantly();
        }

        // ==========================================
        // 8. RENDER BẢNG ĐIỂM & ĐÁP ÁN CÁC ĐỘI
        // ==========================================
        function renderTeamsInstantly() {
            let gridHtml = "";
            const dapanCacDoi = (globalMatchState && globalMatchState.dapan_cacdoi) ? globalMatchState.dapan_cacdoi : {};
            const isRoundEnded = fbShowAnswer || isTimeUpV2;

            // Xếp hạng thứ tự trả lời theo thời gian nộp (nhỏ -> lớn)
            const answeredList = window.activeTeams
                .filter(col => Boolean((dapanCacDoi[col]?.dapan || "").trim()))
                .sort((a, b) => {
                    const tA = Number(dapanCacDoi[a]?.thoigian_nop) || Infinity;
                    const tB = Number(dapanCacDoi[b]?.thoigian_nop) || Infinity;
                    return tA - tB;
                });

            const rankMap = {};
            answeredList.forEach((col, index) => {
                rankMap[col] = index + 1;
            });

            if (window.activeTeams.length > 0) {
                window.activeTeams.forEach(teamCol => {
                    const teamName = window.teamNamesMapping[teamCol];
                    const teamScore = currentScores[teamCol] !== undefined ? currentScores[teamCol] : 0;
                    const flashCls = scoreFlashState[teamCol] === 'up'
                        ? 'score-up'
                        : (scoreFlashState[teamCol] === 'down' ? 'score-down' : '');

                    const teamAnsObj = dapanCacDoi[teamCol] || {};
                    const ansText = (teamAnsObj.dapan || "").trim();
                    const timeNop = Number(teamAnsObj.thoigian_nop) || 0;
                    const timeHtml = timeNop > 0 ? `<div class="team-ans-time">⏱ ${timeNop.toFixed(2)}s</div>` : "";

                    let ansBoxCls = "";
                    let ansContentHtml = "";

                    if (!fbCauHoiHienTai) {
                        ansContentHtml = `<div class="team-ans-empty">Đang chờ câu hỏi...</div>`;
                    } else if (ansText) {
                        ansBoxCls = "has-answer";
                        const rank = rankMap[teamCol];
                        if (isRoundEnded) {
                            ansContentHtml = `<div class="team-ans-text">#${rank} • ${escapeHtml(ansText)}</div>${timeHtml}`;
                        } else {
                            ansContentHtml = `<div class="team-ans-locked">#${rank} • ✓ ĐÃ TRẢ LỜI</div>${timeHtml}`;
                        }
                    } else if (isRoundEnded) {
                        ansBoxCls = "no-answer";
                        ansContentHtml = `<div class="team-ans-timeout">HẾT GIỜ</div>`;
                    } else {
                        ansContentHtml = `<div class="team-ans-empty">Đang suy nghĩ...</div>`;
                    }

                    gridHtml += `
                        <div class="team-card ${flashCls}" id="team-card-${escapeHtml(teamCol)}">
                            <div class="team-name">${escapeHtml(teamName)}</div>
                            <div class="team-score">${teamScore}</div>
                            <div class="team-answer-box ${ansBoxCls}">
                                ${ansContentHtml}
                            </div>
                        </div>`;
                });
            } else {
                gridHtml = '<div class="q-placeholder">Đang tải danh sách đội...</div>';
            }

            document.getElementById('teams-grid').innerHTML = gridHtml;
        }

        function renderQBoard() {
            const qBoard = document.getElementById('q-board');
            const blurredArr = window.fbBlurredArr;

            if (!fbCauHoiHienTai) {
                qBoard.innerHTML = '<div class="q-placeholder">Đang chờ lựa chọn mảnh ghép...</div>';
                return;
            }

            const qData = globalCauHoiV2[fbCauHoiHienTai];
            if (qData) {
                const cur = fbCauHoiHienTai.toString();
                const isCenterQ = isCenterQuestion(cur);
                const isDead = blurredArr.includes(cur) || (isCenterQ && (blurredArr.includes("CNV") || blurredArr.includes("TRUNGTAM")));
                const correctAns = qData.dapAn ? qData.dapAn.toString().normalize('NFC') : "";
                const displayLen = Number(qData.soKyTu) || correctAns.replace(/\s/g, '').length || 0;

                if (isDead) {
                    const dapAnHtml = (fbShowAnswer && correctAns !== "")
                        ? `<div class="q-answer-reveal">ĐÁP ÁN: ${escapeHtml(correctAns)}</div>`
                        : "";
                    qBoard.innerHTML = `<div class="q-subject">[ TỪ KHÓA SỐ ${escapeHtml(cur)} - ${displayLen} KÝ TỰ ]</div><div class="q-text" style="color: var(--muted);">CÂU HỎI ĐÃ BỊ KHÓA</div>${dapAnHtml}`;
                } else if (isCenterQ) {
                    if (isBravoFinished && fbShowAnswer && correctAns !== "") {
                        qBoard.innerHTML = `
                            <div class="q-subject">[ ĐÁP ÁN CÂU TRUNG TÂM - ${displayLen} KÝ TỰ ]</div>
                            <div class="q-answer-reveal" style="border-top: none; margin-top: 0; padding-top: 0;">${escapeHtml(correctAns)}</div>`;
                    } else {
                        qBoard.innerHTML = `
                            <div class="q-subject">[ GỢI Ý CÂU TRUNG TÂM - ${displayLen} KÝ TỰ ]</div>
                            <div class="q-direct-badge">💻 TRẢ LỜI TRÊN MÁY TÍNH</div>
                            <div class="q-text">${qData.noiDung}</div>`;
                    }
                } else {
                    const dapAnHtml = (fbShowAnswer && correctAns !== "")
                        ? `<div class="q-answer-reveal">ĐÁP ÁN: ${escapeHtml(correctAns)}</div>`
                        : "";
                    qBoard.innerHTML = `
                        <div class="q-subject">[ TỪ KHÓA SỐ ${escapeHtml(cur)} - ${displayLen} KÝ TỰ ]</div>
                        <div class="q-direct-badge">💻 TRẢ LỜI TRÊN MÁY TÍNH</div>
                        <div class="q-text">${qData.noiDung}</div>
                        ${dapAnHtml}`;
                }
            } else {
                qBoard.innerHTML = '<div class="q-placeholder">Đang chờ lựa chọn mảnh ghép...</div>';
            }
        }

        // ==========================================
        // 9. KHỞI ĐỘNG
        // ==========================================
        window.onload = async function () {
            setInterval(updateAudienceTimer, 100);

            await loadFbConfig();
            await syncServerClock(FB.vong2);
            await fetchTeamNames();
            setInterval(fetchScoresFromAPI, 1000);
            setInterval(fetchVong2Data, 500);
        };
    </script>
</body>
</html>
