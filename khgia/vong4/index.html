<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia - Vòng 4: Về Đích (Màn hình Khán giả)</title>
    <script>
/* =====================================================================
   V4 Core - Đọc riêng api_url từ ../../api/vong4.json và ../../api/diemso.json
   ===================================================================== */
window.V4 = (function () {
  "use strict";
  var CFG_ROUND = "../../api/vong4.json";
  var CFG_SCORE = "../../api/diemso.json";
  var ROUND_URL = "";
  var SCORE_URL = "";
  var cfgError = null;

  function stripJson(u) {
    return String(u || "").trim().replace(/\.json(\?.*)?$/i, "").replace(/\/$/, "");
  }

  var ready = (async function () {
    try {
      var results = await Promise.all([
        fetch(CFG_ROUND + "?_t=" + Date.now()),
        fetch(CFG_SCORE + "?_t=" + Date.now())
      ]);
      var r1 = results[0], r2 = results[1];

      if (!r1.ok) throw new Error("Không đọc được " + CFG_ROUND + " (HTTP " + r1.status + ")");
      var c1 = await r1.json();
      if (!c1 || !c1.api_url) throw new Error("File " + CFG_ROUND + " thiếu trường api_url");
      ROUND_URL = stripJson(c1.api_url);

      if (r2.ok) {
        var c2 = await r2.json();
        if (c2 && c2.api_url) SCORE_URL = stripJson(c2.api_url);
      }
      if (!SCORE_URL) {
        SCORE_URL = ROUND_URL.replace(/\/[^\/]+$/, "") + "/diemso";
      }
    } catch (e) {
      cfgError = e;
    }
  })();

  async function send(path, method, body) {
    await ready;
    if (!ROUND_URL) throw (cfgError || new Error("Chưa cấu hình api_url"));

    var base, sub = "";
    if (path === "diemso" || path.indexOf("diemso/") === 0) {
      base = SCORE_URL;
      sub = path.slice(6);
    } else if (path === "vong4" || path.indexOf("vong4/") === 0) {
      base = ROUND_URL;
      sub = path.slice(5);
    } else {
      base = ROUND_URL.replace(/\/[^\/]+$/, "");
      sub = "/" + path;
    }

    var o = { method: method };
    if (body !== undefined) {
      o.body = JSON.stringify(body);
      o.headers = { "Content-Type": "application/json" };
    }
    var url = base + sub + ".json" + (method === "GET" ? "?_t=" + Date.now() : "");
    var r = await fetch(url, o);
    if (!r.ok) throw new Error("Firebase lỗi " + r.status + " (" + path + ")");
    return r.json();
  }

  var nat = function (a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); };

  function teamsFrom(d) {
    return Object.keys(d || {}).sort(nat).map(function (k, i) {
      var v = d[k] || {};
      return { doi: k, tendoi: v.tendoi || ("Đội " + (i + 1)), diem: parseInt(v.diem) || 0 };
    });
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  return {
    get: function (p) { return send(p, "GET"); },
    patch: function (p, b) { return send(p, "PATCH", b); },
    send: send,
    teamsFrom: teamsFrom,
    esc: esc
  };
})();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@500;700&display=swap');

<body>
    <div id="main-game">
        <div class="header">
            <div class="header-left">
                <div class="title">VÒNG 4: VỀ ĐÍCH</div>
                <button id="btn-audio" class="btn-audio-toggle" onclick="toggleAudio()">🔇 BẬT ÂM THANH</button>
            </div>
            <div class="team-name">
                <span id="display-team-name">PHẦN THI CỦA: ĐANG CHỜ...</span>
            </div>
        </div>
        <div class="main-content">
            <div class="question-box" id="q-box">
                <div class="msg-box">Đang kết nối tín hiệu Firebase...</div>
            </div>
            <div id="action-area" style="width: 100%; display: flex; justify-content: center; flex-direction: column; align-items: center;"></div>
        </div>
        <div class="footer" id="audience-footer">
            <div class="stat-box">
                <span class="stat-label" id="score-team-label">ĐIỂM SỐ</span>
                <span class="stat-value" id="current-score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">THỜI GIAN</span>
                <span class="stat-value timer" id="time-left">0s</span>
            </div>
        </div>
    </div>

    <script>
        const esc = V4.esc;

        // ================= QUẢN LÝ ÂM THANH VÒNG 4 =================
        const SFX = {
            traLoi: new Audio("../../sound_effect/amthanhv4/30s-v4.mp3"),
            cuopDiem: new Audio("../../sound_effect/amthanhv4/5s_cuopdiem-v4.mp3")
        };
        SFX.traLoi.preload = "auto";
        SFX.cuopDiem.preload = "auto";

        let audioEnabled = false;
        let hasInitializedPoll = false;

        function stopAllSounds() {
            Object.values(SFX).forEach(a => {
                if (!a.paused || a.currentTime > 0) {
                    a.pause();
                    a.currentTime = 0;
                }
            });
        }

        function playSound(key) {
            stopAllSounds();
            if (!audioEnabled || !SFX[key]) return;
            SFX[key].currentTime = 0;
            SFX[key].play().catch(err => console.warn("Không thể phát âm thanh:", err));
        }

        window.toggleAudio = function() {
            const btn = document.getElementById('btn-audio');
            audioEnabled = !audioEnabled;
            if (audioEnabled) {
                Object.values(SFX).forEach(a => {
                    a.muted = true;
                    const p = a.play();
                    if (p !== undefined) {
                        p.then(() => {
                            a.pause();
                            a.currentTime = 0;
                            a.muted = false;
                        }).catch(() => { a.muted = false; });
                    } else {
                        a.muted = false;
                    }
                });
                btn.innerText = "🔊 ÂM THANH: BẬT";
                btn.classList.add('active');
            } else {
                stopAllSounds();
                btn.innerText = "🔇 BẬT ÂM THANH";
                btn.classList.remove('active');
            }
        };

        // Firebase: vong4/{question_bank, TrangThaiV4}, diemso/{doiX: {diem, tendoi}}
        window.teams = [
            { doi: 'doi1', tendoi: 'Đội 1', diem: 0 },
            { doi: 'doi2', tendoi: 'Đội 2', diem: 0 },
            { doi: 'doi3', tendoi: 'Đội 3', diem: 0 },
            { doi: 'doi4', tendoi: 'Đội 4', diem: 0 }
        ];
        window.activeTeamName = "";
        window.currentStatus = "";
        window.currentGameState = "";
        window.rankShown = false;

        window.lastTimerTrigger = 0;
        window.localEndTime = null;

        function setHTML(el, html) {
            if (!el || el._lastHtml === html) return;
            el.innerHTML = html;
            el._lastHtml = html;
        }

        function findQuestion(fullData, qId) {
            if (!fullData || !qId) return null;
            const key = String(qId);
            let raw =
                (fullData.question_bank && fullData.question_bank[key]) ||
                (fullData.CauHoiV4 && fullData.CauHoiV4[key]) ||
                fullData[key];

            if (!raw || typeof raw !== 'object' || (!raw.cauhoi && !raw.noiDung)) {
                raw = null;
                const pools = [fullData.question_bank, fullData.CauHoiV4, fullData];
                for (const pool of pools) {
                    if (!pool || typeof pool !== 'object') continue;
                    if (pool[key] && typeof pool[key] === 'object' && (pool[key].cauhoi || pool[key].noiDung)) {
                        raw = pool[key];
                        break;
                    }
                    const found = Object.values(pool).find(
                        item => item && typeof item === 'object' && String(item.id) === key && (item.cauhoi || item.noiDung)
                    );
                    if (found) { raw = found; break; }
                }
            }

            if (!raw || typeof raw !== 'object') return null;
            return {
                noiDung: raw.cauhoi || raw.noiDung || "",
                dapAn: raw.danan || raw.dapAn || raw.dapan || "",
                url: raw.url || raw.anh || raw.linkAnh || raw.hinhanh || raw.hinh_anh || raw.image || raw.img || raw.url_anh || ""
            };
        }

        function resolveImageUrl(qObj) {
            if (!qObj) return null;
            const raw = qObj.url || qObj.anh || qObj.linkAnh || qObj.hinhanh || qObj.hinh_anh || qObj.image || qObj.img || qObj.url_anh || "";
            if (typeof raw !== "string") return null;

            const imgName = raw.trim();
            if (imgName === "" || imgName.toUpperCase() === "NULL" || imgName === "undefined") return null;

            const driveMatch = imgName.match(/[-\w]{25,}/);
            if (imgName.includes("drive.google.com") && driveMatch) {
                return "https://drive.google.com/thumbnail?id=" + driveMatch[0] + "&sz=w1200";
            }
            if (!imgName.includes(".") && !imgName.includes("/") && imgName.length >= 25) {
                return "https://drive.google.com/thumbnail?id=" + imgName + "&sz=w1200";
            }
            if (imgName.startsWith("http://") || imgName.startsWith("https://")) {
                return imgName;
            }
            return "../../img/vong4/" + imgName;
        }

        // Tự động tính cỡ chữ câu hỏi theo độ dài để không tràn khung
        function getQuestionFontSize(text, hasImage) {
            const len = String(text || "").length;
            const lines = String(text || "").split('\n').length;
            if (hasImage) {
                if (len > 260 || lines >= 6) return "1.75rem";
                if (len > 170 || lines >= 4) return "2rem";
                return "2.35rem";
            }
            if (len > 280 || lines >= 6) return "1.9rem";
            if (len > 180 || lines >= 4) return "2.2rem";
            return "2.6rem";
        }

        // Tự động tính cỡ chữ đáp án dài (Phương án 1)
        function isLongAnswer(ansText) {
            const s = String(ansText || "").trim();
            return s.length > 55 || s.includes('\n');
        }

        function getLongAnswerFontSize(ansText) {
            const s = String(ansText || "").trim();
            const lines = s.split('\n').length;
            if (s.length > 340 || lines >= 7) return "1.75rem";
            if (s.length > 220 || lines >= 5) return "2.05rem";
            if (s.length > 120 || lines >= 3) return "2.35rem";
            return "2.7rem";
        }

        function buildTagsHtml(data) {
            const starHtml = data.ngoiSao ? `<span class="info-tag star-tag">⭐ NGÔI SAO HY VỌNG</span>` : "";
            const teamHtml = `<span class="info-tag">CHỦ NHÀ: ${esc(data.doiDangThi)}</span>`;
            const ptsHtml = `<span class="info-tag" style="border-color:#5cf0a0; color: #7dffb4;">CÂU ${esc(data.mucDiem)} ĐIỂM</span>`;
            return `<div class="tags-container">${teamHtml} ${ptsHtml} ${starHtml}</div>`;
        }

        function buildQuestionContent(data) {
            const tagsHtml = buildTagsHtml(data);
            const rawText = data.question ? data.question.noiDung : "Đang tải nội dung...";
            const questionText = esc(rawText);
            const imgLink = resolveImageUrl(data.question);
            const qFontSize = getQuestionFontSize(rawText, !!imgLink);

            if (imgLink) {
                return `
                    ${tagsHtml}
                    <div class="q-split-container">
                        <div class="q-left-panel" style="font-size:${qFontSize};">${questionText}</div>
                        <div class="q-right-panel">
                            <img class="q-image" src="${esc(imgLink)}" onerror="this.outerHTML='<div class=\\'img-error-box\\'>⚠️ Không tải được ảnh!<br><small style=\\'color:#fff;\\'>Đường dẫn: ${esc(imgLink)}</small></div>'">
                        </div>
                    </div>
                `;
            }
            return `
                ${tagsHtml}
                <div style="text-align: center; white-space: pre-wrap; line-height: 1.5; font-weight: 800; font-size:${qFontSize}; text-shadow: 0 2px 8px rgba(0,0,0,0.7);">${questionText}</div>
            `;
        }

        function buildLongAnswerContent(data, rawAns) {
            const tagsHtml = buildTagsHtml(data);
            const ansFontSize = getLongAnswerFontSize(rawAns);
            return `
                ${tagsHtml}
                <div class="ans-long-heading">ĐÁP ÁN CHÍNH THỨC CỦA CHƯƠNG TRÌNH</div>
                <div class="ans-long-box" style="font-size:${ansFontSize};">${esc(rawAns)}</div>
            `;
        }

        function showLeaderboard(qBox) {
            const html = renderFinalLeaderboard();
            const changed = qBox._lastHtml !== html;
            setHTML(qBox, html);
            if (!window.rankShown) {
                qBox.querySelectorAll('.rank-row').forEach(r => r.classList.add('enter'));
                window.rankShown = true;
            } else if (changed) {
                qBox.querySelectorAll('.rank-row').forEach(r => r.classList.remove('enter'));
            }
        }

        function updateActiveTeamScoreUI() {
            const topHeaderEl = document.getElementById('display-team-name');
            const bottomLabelEl = document.getElementById('score-team-label');
            const bottomScoreEl = document.getElementById('current-score');

            if (window.currentGameState === "BangDiem") {
                topHeaderEl.innerText = "BẢNG ĐIỂM TRỰC TIẾP";
                return;
            }
            if (window.currentGameState === "KetThucVong4") {
                topHeaderEl.innerText = "TỔNG KẾT & TRAO GIẢI";
                return;
            }

            if (window.activeTeamName && window.activeTeamName.trim() !== "") {
                topHeaderEl.innerText = "PHẦN THI CỦA: " + window.activeTeamName;
                bottomLabelEl.innerText = window.activeTeamName;

                let target = window.teams.find(t => t.tendoi === window.activeTeamName);
                if (!target) {
                    const match = window.activeTeamName.match(/\d+/);
                    if (match) {
                        const num = match[0];
                        target = window.teams.find(t => t.doi.toLowerCase() === ("doi" + num));
                    }
                }
                if (target) {
                    bottomScoreEl.innerText = target.diem;
                }
            } else {
                topHeaderEl.innerText = "PHẦN THI CỦA: CHƯA CHỌN";
                bottomLabelEl.innerText = "ĐIỂM SỐ";
                bottomScoreEl.innerText = "0";
            }
        }

        function renderAllFourScores() {
            const cardsHtml = window.teams.map(t => `
                <div class="score-card-item">
                    <div class="score-card-name">${esc(t.tendoi)}</div>
                    <div class="score-card-val">${t.diem}</div>
                </div>
            `).join('');

            return `
                <div style="font-family: 'Montserrat', sans-serif; font-size: 2.8rem; color: #ffd84d; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255, 216, 77, 0.7), 0 2px 6px rgba(0,0,0,0.8);">
                    ĐIỂM SỐ HIỆN TẠI CỦA CÁC ĐỘI THI
                </div>
                <div class="all-scores-grid" style="grid-template-columns: repeat(${Math.max(window.teams.length, 1)}, 1fr);">${cardsHtml}</div>
            `;
        }

        function renderFinalLeaderboard() {
            const teamsList = window.teams.map(t => ({
                key: t.doi,
                name: t.tendoi,
                score: t.diem
            }));

            teamsList.sort((a, b) => b.score - a.score);

            const rankConfigs = [
                { label: 'HẠNG NHẤT - CÚP VÀNG', rowClass: 'rank-1', labelColor: '#ffd700', icons: ['🏆', '👑', '🌟', '💎'] },
                { label: 'HẠNG NHÌ - CÚP BẠC',   rowClass: 'rank-2', labelColor: '#e0e0e0', icons: ['🥈', '🏅', '💠', '🔷'] },
                { label: 'HẠNG BA - CÚP ĐỒNG',   rowClass: 'rank-3', labelColor: '#ffb07c', icons: ['🥉', '🎗️', '🔶', '🔸'] },
                { label: 'GIẢI KHUYẾN KHÍCH',    rowClass: 'rank-4', labelColor: '#8eeaff', icons: ['🎖️', '🏵️', '⭐', '🔹'] }
            ];

            let groupStart = 0;
            let currentRankIdx = 0;

            const rowsHtml = teamsList.map((team, idx) => {
                if (idx > 0 && team.score < teamsList[idx - 1].score) {
                    currentRankIdx = idx;
                    groupStart = idx;
                }
                const cfg = rankConfigs[Math.min(currentRankIdx, 3)];
                const icon = cfg.icons[Math.min(idx - groupStart, cfg.icons.length - 1)];
                return `
                    <div class="rank-row ${cfg.rowClass}">
                        <div class="rank-left">
                            <span class="cup-icon">${icon}</span>
                            <div>
                                <span class="rank-title-badge" style="color: ${cfg.labelColor};">${cfg.label}</span>
                                <div class="rank-team-name">${esc(team.name)}</div>
                            </div>
                        </div>
                        <div class="rank-score-val">${team.score} <span style="font-size: 2rem;">ĐIỂM</span></div>
                    </div>
                `;
            }).join('');

            return `
                <div style="font-family: 'Montserrat', sans-serif; font-size: 2.6rem; color: #ffd84d; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255, 216, 77, 0.8), 0 2px 6px rgba(0,0,0,0.8);">
                    🏆 BẢNG XẾP HẠNG CHUNG CUỘC - VÒNG VỀ ĐÍCH 🏆
                </div>
                <div class="ranking-list">${rowsHtml}</div>
            `;
        }

        function renderGameState(fullData) {
            const data = Object.assign({}, (fullData && fullData.TrangThaiV4) || {});

            window.currentGameState = data.trangThaiGame || "";
            if (window.currentGameState !== "KetThucVong4") window.rankShown = false;
            window.activeTeamName = data.doiDangThi || "";
            updateActiveTeamScoreUI();

            const footerEl = document.getElementById('audience-footer');
            if (data.trangThaiGame === "BangDiem" || data.trangThaiGame === "KetThucVong4") {
                footerEl.style.display = "none";
            } else {
                footerEl.style.display = "flex";
            }

            if (!hasInitializedPoll) {
                window.lastTimerTrigger = data.timerTrigger || 0;
                hasInitializedPoll = true;
            } else if (data.timerTrigger && data.timerTrigger !== window.lastTimerTrigger) {
                window.lastTimerTrigger = data.timerTrigger;
                if (data.thoiGianKetThuc > 0) {
                    window.localEndTime = Date.now() + data.thoiGianKetThuc;
                    if (data.trangThaiGame === "TraLoi") {
                        playSound("traLoi");
                    } else if (data.trangThaiGame === "CuopDiem") {
                        playSound("cuopDiem");
                    }
                } else {
                    window.localEndTime = null;
                    stopAllSounds();
                }
            } else if (!data.timerTrigger || data.timerTrigger === 0) {
                window.localEndTime = null;
                stopAllSounds();
            }

            if (data.trangThaiGame !== "TraLoi" && data.trangThaiGame !== "CuopDiem") {
                stopAllSounds();
            }

            data.question = findQuestion(fullData, data.cauHoiHienTai);

            const qBox = document.getElementById('q-box');
            const actArea = document.getElementById('action-area');

            const statusKey = (data.cauHoiHienTai || "") + (data.trangThaiGame || "") + (data.doiDangThi || "");
            if (window.currentStatus !== statusKey) {
                window.currentStatus = statusKey;
            }

            if (data.trangThaiGame === "BangDiem") {
                setHTML(qBox, renderAllFourScores());
                setHTML(actArea, '');
            }
            else if (data.trangThaiGame === "KetThucVong4") {
                showLeaderboard(qBox);
                setHTML(actArea, '');
            }
            else if (data.trangThaiGame === "ChonGoi") {
                if (data.goiCauHoi && data.goiCauHoi !== "") {
                    setHTML(qBox, `<div style="font-size: 3rem; color: #ffd84d; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 12px rgba(255, 216, 77, 0.55), 0 2px 6px rgba(0,0,0,0.8);">GÓI ĐIỂM CỦA ${esc(data.doiDangThi)} LÀ:</div>`);
                    setHTML(actArea, renderBeautifulPackage(data.goiCauHoi));
                } else {
                    setHTML(qBox, `<div style="font-size: 3rem; color: #e6f3fa; font-style: italic; animation: pulseStar 2s infinite; font-weight: 700;">Đang chờ MC chọn gói điểm cho ${esc(data.doiDangThi)}...</div>`);
                    setHTML(actArea, '');
                }
            }
            else if (data.trangThaiGame === "KetThuc") {
                setHTML(qBox, `<div class="msg-box" style="font-size: 2.8rem; color: #8eeaff; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 18px rgba(127, 227, 255, 0.67), 0 2px 6px rgba(0,0,0,0.8);">ĐÃ KẾT THÚC PHẦN THI CỦA ${esc(data.doiDangThi || "ĐỘI NÀY")}.<br><span style="font-size:2rem; margin-top:15px; display:inline-block; color:#e6f3fa; font-weight: 700; text-transform: none; text-shadow: none;">Chúc mừng đội thi đã hoàn thành phần thi Về Đích!</span></div>`);
                setHTML(actArea, '');
            }
            else if (data.trangThaiGame === "Cho") {
                setHTML(qBox, `
                    ${buildTagsHtml(data)}
                    <span style='font-size: 5rem; color: #8eeaff; letter-spacing: 15px; font-weight: 900; text-shadow: 0 0 18px rgba(127, 227, 255, 0.67), 0 2px 6px rgba(0,0,0,0.8);'>???</span>
                `);

                if (data.ngoiSao) {
                    setHTML(actArea, `<div class="msg-box" style="font-size: 3rem; color: #ffd84d; font-weight: 900; text-transform: uppercase; animation: pulseStar 1.5s infinite; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">⭐ ${esc(data.doiDangThi)} ĐÃ CHỌN NGÔI SAO HY VỌNG! ⭐</div>`);
                } else {
                    setHTML(actArea, `<div class="msg-box" style="font-size: 2.5rem; color: #8eeaff; font-weight: 900; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">${esc(data.doiDangThi)} CHUẨN BỊ...</div>`);
                }
            }
            else if (data.trangThaiGame === "HienDapAn") {
                const rawAns = data.question ? (data.question.dapAn || "Không có đáp án") : "Không có đáp án";
                if (isLongAnswer(rawAns)) {
                    // Phương án 1: Đáp án dài -> ẩn đề & ảnh, nhường trọn giữa màn hình cho hộp đáp án
                    setHTML(qBox, buildLongAnswerContent(data, rawAns));
                    setHTML(actArea, '');
                } else {
                    // Đáp án ngắn -> giữ đề ở trên, đáp án nổi bật ở dưới
                    setHTML(qBox, buildQuestionContent(data));
                    setHTML(actArea, `<div class="msg-box" style="color:#7dffb4; font-weight:900; font-size: 2.1rem; font-style:normal; text-align:center; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">ĐÁP ÁN CHÍNH THỨC CỦA CHƯƠNG TRÌNH:<br><span class="ans-opened-box">${esc(rawAns)}</span></div>`);
                }
            }
            else if (data.trangThaiGame === "ChonCauHoi" || data.trangThaiGame === "ChuanBi" || !data.cauHoiHienTai || data.cauHoiHienTai === "") {
                const usedSet = new Set(data.usedQuestions ? data.usedQuestions.split(',').map(s => s.trim()).filter(Boolean) : []);
                const arr12 = Array.from({ length: 12 }, (_, i) => i + 1);

                const html20 = arr12.map(i => `<div class="q-btn-client q-btn-20-client${usedSet.has(`20_${i}`) ? ' used' : ''}">${i}</div>`).join('');
                const html30 = arr12.map(i => `<div class="q-btn-client q-btn-30-client${usedSet.has(`30_${i}`) ? ' used' : ''}">${i}</div>`).join('');

                const gridHtml = `
                    <div style="font-size: 2.5rem; color: #ffd84d; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 12px rgba(255, 216, 77, 0.55), 0 2px 6px rgba(0,0,0,0.8);">🎙 MỜI ${esc(data.doiDangThi || "THÍ SINH")} CHỌN CÂU HỎI</div>
                    <div class="q-grids-client">
                        <div class="q-col-client q-col-20-client">
                            <div class="q-col-title-client">BẢNG 20 ĐIỂM</div>
                            <div class="q-btn-grid-client">${html20}</div>
                        </div>
                        <div class="q-col-client q-col-30-client">
                            <div class="q-col-title-client">BẢNG 30 ĐIỂM</div>
                            <div class="q-btn-grid-client">${html30}</div>
                        </div>
                    </div>
                `;
                setHTML(qBox, gridHtml);
                setHTML(actArea, '');
            }
            else {
                setHTML(qBox, buildQuestionContent(data));

                if (data.trangThaiGame === "TraLoi") {
                    if (window.localEndTime === null || (window.localEndTime - Date.now()) > 0) {
                        setHTML(actArea, `<div class="msg-box" style="font-size: 2.3rem; color: #ffd84d; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">⏱ Đang trong thời gian suy nghĩ và trả lời của ${esc(data.doiDangThi)}...</div>`);
                    }
                }
                else if (data.trangThaiGame === "CuopDiem") {
                    if (window.localEndTime === null || (window.localEndTime - Date.now()) > 0) {
                        setHTML(actArea, `<div class="msg-box" style="color:#ff4b2b; font-weight:900; font-size: 2.8rem; text-shadow: 0 0 22px rgba(255, 75, 43, 0.8), 0 2px 6px rgba(0,0,0,0.8); text-transform: uppercase; text-align:center;">🚨 THỜI GIAN GIÀNH QUYỀN TRẢ LỜI 🚨<br><span style="font-size:2rem; color:#ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">Mời các đội còn lại giơ tay cướp điểm!</span></div>`);
                    }
                }
            }
        }

        function renderBeautifulPackage(pkgStr) {
            const pkgs = pkgStr.split(',');
            let displayHtml = '<div style="display: flex; gap: 40px; justify-content: center; margin-top: 10px;">';
            pkgs.forEach((p, idx) => {
                const pColor = (p === '20') ? 'rgba(92, 240, 160, 0.6)' : 'rgba(220, 53, 69, 0.6)';
                const border = (p === '20') ? '#5cf0a0' : '#dc3545';
                const shadow = (p === '20') ? 'rgba(92, 240, 160, 0.6)' : 'rgba(220, 53, 69, 0.6)';
                displayHtml += `<div style="text-align:center;">
                    <div style="font-size:1.5rem; font-weight:900; color:#ffffff; margin-bottom:10px; text-transform:uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Câu ${idx + 1}</div>
                    <div style="background: ${pColor}; padding: 25px 50px; border-radius: 20px; font-size: 5rem; font-weight: 900; color: white; box-shadow: 0 0 22px ${shadow}; border: 4px solid ${border}; font-family: 'Montserrat', sans-serif; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">${esc(p)}</div>
                </div>`;
            });
            displayHtml += '</div>';
            return displayHtml;
        }

        function updateTimer() {
            const timeElement = document.getElementById('time-left');
            if (window.currentStatus.includes("HienDapAn") || window.currentStatus.includes("KetThuc") || window.currentStatus.includes("BangDiem")) {
                timeElement.innerText = "0s";
                timeElement.style.color = "#ff4b2b";
                window.localEndTime = null;
                stopAllSounds();
                return;
            }

            if (!window.localEndTime) {
                timeElement.innerText = "0s";
                timeElement.style.color = "#ff4b2b";
                return;
            }

            timeElement.style.color = "#ff4b2b";
            const dist = window.localEndTime - Date.now();

            if (dist <= 0) {
                timeElement.innerText = "0s";
                stopAllSounds();
                const actArea = document.getElementById('action-area');
                if (window.currentStatus.includes("TraLoi")) {
                    setHTML(actArea, `<div class="msg-box" style="color:#ff4b2b; font-weight:900; font-size: 2.5rem; text-align:center; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">⏳ HẾT THỜI GIAN TRẢ LỜI!</div>`);
                } else if (window.currentStatus.includes("CuopDiem")) {
                    setHTML(actArea, `<div class="msg-box" style="color:#ff4b2b; font-weight:900; font-size: 2.5rem; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">⏳ HẾT THỜI GIAN CƯỚP ĐIỂM!</div>`);
                }
            } else {
                const seconds = Math.ceil(dist / 1000);
                timeElement.innerText = seconds + "s";
            }
        }

        async function pollAudience() {
            try {
                const [v4, ds] = await Promise.all([V4.get("vong4"), V4.get("diemso")]);
                const parsedTeams = V4.teamsFrom(ds || {});
                if (parsedTeams.length > 0) {
                    window.teams = parsedTeams;
                }
                renderGameState(v4 || {});
            } catch (err) {
                console.error("Lỗi lấy dữ liệu Firebase:", err);
                const qBox = document.getElementById('q-box');
                if (!window.currentGameState) {
                    setHTML(qBox, `<div class="msg-box" style="color:#ff4b2b;">⚠️ Lỗi kết nối Firebase: ${esc(err.message)}</div>`);
                }
            } finally {
                setTimeout(pollAudience, 500);
            }
        }

        // ================= TỰ ĐỘNG CO GIÃN THEO MỌI MÀN HÌNH =================
        function autoScaleStage() {
            const stage = document.getElementById('main-game');
            if (!stage) return;
            const BASE_W = 1920;
            const BASE_H = 1080;
            const scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);

            stage.style.width = (window.innerWidth / scale) + 'px';
            stage.style.height = (window.innerHeight / scale) + 'px';
            stage.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', autoScaleStage);
        autoScaleStage();

        window.onload = function() {
            pollAudience();
            setInterval(updateTimer, 100);
        };
    </script>
</body>
</html>
