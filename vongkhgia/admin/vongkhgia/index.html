<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia Admin - Vòng 1 Chung</title>
    <script>
/* =====================================================================
   V1C Core - Chỉ đọc api_url từ ../../api/vong1_chung.json
   Hỗ trợ cả api_url trỏ về gốc Firebase lẫn trỏ về node con (/vong1_chung)
   ===================================================================== */
window.V1C = (function () {
  "use strict";
  var CFG_ROUND = "../../api/vong1_chung.json";
  var ROUND_URL = "";
  var IS_ROOT = false;
  var cfgError = null;

  function stripJson(u) {
    return String(u || "").trim().replace(/\/?\.json(\?.*)?$/i, "").replace(/\/+$/, "");
  }

  var ready = (async function () {
    try {
      var r1 = await fetch(CFG_ROUND + "?_t=" + Date.now());
      if (!r1.ok) throw new Error("Không đọc được " + CFG_ROUND + " (HTTP " + r1.status + ")");
      var c1 = await r1.json();
      if (!c1 || !c1.api_url) throw new Error("File " + CFG_ROUND + " thiếu trường api_url");
      ROUND_URL = stripJson(c1.api_url);

      try {
        var parsedUrl = new URL(ROUND_URL);
        IS_ROOT = (!parsedUrl.pathname || parsedUrl.pathname === "/");
      } catch (err) {
        IS_ROOT = false;
      }
    } catch (e) {
      cfgError = e;
    }
  })();

  async function send(subPath, method, body) {
    await ready;
    if (!ROUND_URL) throw (cfgError || new Error("Chưa cấu hình api_url"));

    var cleanSub = String(subPath || "").replace(/^\/+|\/+$/g, "");
    var url;
    if (!cleanSub) {
      url = ROUND_URL + (IS_ROOT ? "/.json" : ".json");
    } else {
      url = ROUND_URL + "/" + cleanSub + ".json";
    }
    if (method === "GET") {
      url += "?_t=" + Date.now();
    }

    var o = { method: method };
    if (body !== undefined) {
      o.body = JSON.stringify(body);
      o.headers = { "Content-Type": "application/json" };
    }
    var r = await fetch(url, o);
    if (!r.ok) throw new Error("Firebase lỗi " + r.status + " (" + (cleanSub || "root") + ")");
    return r.json();
  }

  var nat = function (a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); };

  function list(o) {
    if (!o) return [];
    var e = Array.isArray(o) ? o.map(function (v, i) { return [String(i), v]; }) : Object.entries(o);
    return e.filter(function (x) { return x[1] != null && typeof x[1] === "object"; }).sort(function (a, b) {
      var sa = a[1].sttcau != null ? a[1].sttcau : (a[1].id != null ? a[1].id : a[0]);
      var sb = b[1].sttcau != null ? b[1].sttcau : (b[1].id != null ? b[1].id : b[0]);
      return nat(sa, sb);
    });
  }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  return {
    get: function (p) { return send(p || "", "GET"); },
    patch: function (p, b) { return send(p || "", "PATCH", b); },
    send: send,
    list: list,
    esc: esc
  };
})();
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 15px; color: #333; }
        .dashboard { max-width: 98%; margin: 0 auto; }

        .header-panel { background: #003366; color: white; padding: 20px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header-panel h1 { margin: 0; font-size: 2rem; }
        .btn-reset { background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .btn-reset:hover { background: #c82333; }

        .btn-link {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-link:hover { background: #218838; }

        /* KHUNG NGÂN HÀNG CÂU HỎI */
        .questions-panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .q-header { border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* THANH SỐ THỨ TỰ (TRÒN) */
        .quick-nav-box { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #eee; justify-content: center; }
        .q-circle { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #ccc; background: white; color: #333; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .q-circle.opened { border-color: #ffc107; background: #fff3cd; color: #856404; }
        .q-circle.active { border-color: #007bff; background: #007bff; color: white; transform: scale(1.15); box-shadow: 0 0 15px rgba(0,123,255,0.6); }
        .q-circle:hover { transform: scale(1.1); border-color: #007bff; }

        .q-list { display: flex; flex-direction: column; gap: 15px; }
        .q-item { background: #f8f9fa; padding: 20px; border: 1px solid #dee2e6; border-radius: 10px; display: none; flex-direction: column; gap: 15px; transition: 0.2s; }
        .q-item.active { display: flex; background: #e7f1ff; border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.2); border-left: 6px solid #007bff; }

        .q-title { font-size: 1.4rem; font-weight: bold; color: #003366; }
        .q-content { font-size: 1.25rem; line-height: 1.6; color: #333; white-space: pre-wrap; overflow-wrap: anywhere; }
        .q-answer-admin { font-size: 1.2rem; color: #28a745; font-weight: bold; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }

        .q-media-admin { margin-top: 10px; padding: 12px; background: #ffffff; border: 1px solid #cfe2ff; border-radius: 8px; }
        .q-media-admin.answer-media { border-color: #badbcc; background: #f3fcf6; }
        .q-media-label { font-size: 0.98rem; font-weight: 700; color: #003366; margin-bottom: 8px; }
        .q-media-hint { font-size: 0.95rem; font-weight: 600; color: #6c757d; margin-top: 6px; font-style: italic; }
        .q-admin-img { max-width: 100%; max-height: 280px; border-radius: 8px; border: 1px solid #dee2e6; display: block; object-fit: contain; background: #fff; }
        .img-error-admin { color: #dc3545; font-size: 0.95rem; font-weight: 600; padding: 8px; background: #fff5f5; border: 1px dashed #dc3545; border-radius: 6px; }

        .q-actions { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .btn-timer-5s {
            flex: 1;
            min-width: 200px;
            background: #ff6b00;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(255, 107, 0, 0.3);
        }
        .btn-timer-5s:hover { background: #e05e00; transform: translateY(-1px); }
        .btn-timer-5s.running { background: #dc3545; box-shadow: 0 0 14px rgba(220, 53, 69, 0.55); }

        .btn-dapan {
            flex: 1.2;
            min-width: 240px;
            background: #6c757d;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-dapan.opened { background: #28a745; box-shadow: 0 0 10px rgba(40,167,69,0.4); }

        #status-text { text-align: center; color: #666; font-style: italic; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header-panel">
            <a href="../vong2/" class="btn-link">MẶC ĐỊNH VÒNG 1</a>
            <h1>BẢNG ĐIỀU KHIỂN MC - VÒNG 1 CHUNG</h1>
            <div>
                <button class="btn-reset" onclick="resetRound()">Làm mới Vòng Chơi</button>
                <a href="../vong2/" class="btn-link" style="margin-left: 10px;">CHUYỂN VÒNG 2 ▶</a>
            </div>
        </div>

        <div class="questions-panel">
            <div class="q-header">
                <h2 style="margin: 0; color: #333;">Ngân hàng câu hỏi & Trạng thái</h2>
                <button class="btn-reset" style="background:#343a40;" onclick="closeQuestion()">ĐÓNG CÂU HỎI & LÀM SẠCH MÀN HÌNH</button>
            </div>

            <div class="quick-nav-box" id="quick-nav"></div>

            <div class="q-list" id="question-list">
                <div style="text-align:center; color:#666; font-style:italic;">Đang tải dữ liệu từ Firebase...</div>
            </div>
        </div>

        <div id="status-text">Đang kết nối Firebase...</div>
    </div>

    <script>
        // Hỗ trợ cả cấu trúc FirebaseMyAdmin (question_bank + match_state) lẫn cấu trúc cũ (danhSachCauHoi + root)
        const esc = V1C.esc;
        let currentSelectedQuestion = null;
        let serverActiveQuestion = '';
        let openedQuestions = [];
        let cachedQuestions = []; // [[fbKey, qObj], ...]
        let bankSubPath = "question_bank";
        let stateSubPath = "match_state";
        let stateBusy = false;
        let adminTimerEnd = null;

        function setHTML(el, html) {
            if (!el || el._lastHtml === html) return;
            el.innerHTML = html;
            el._lastHtml = html;
        }

        // Xử lý link ảnh câu hỏi
        function resolveImageUrl(qObj) {
            if (!qObj) return null;
            const raw = qObj.url || qObj.anh || qObj.linkAnh || qObj.hinhanh || qObj.hinh_anh || qObj.image || qObj.img || qObj.url_anh || "";
            if (typeof raw !== "string") return null;

            const imgName = raw.trim();
            if (imgName === "" || imgName.toUpperCase() === "NULL" || imgName === "undefined") return null;

            const driveMatch = imgName.match(/[-\w]{25,}/);
            if (imgName.includes("drive.google.com") && driveMatch) {
                return "https://drive.google.com/thumbnail?id=" + driveMatch[0] + "&sz=w1200";
            }
            if (!imgName.includes(".") && !imgName.includes("/") && imgName.length >= 25) {
                return "https://drive.google.com/thumbnail?id=" + imgName + "&sz=w1200";
            }
            if (imgName.startsWith("http://") || imgName.startsWith("https://")) {
                return imgName;
            }
            return "../../img/vong1_chung/" + imgName;
        }

        // Xử lý link ảnh đáp án (urldapan)
        function resolveAnswerImageUrl(qObj) {
            if (!qObj) return null;
            const raw = qObj.urldapan || qObj.url_dapan || qObj.anhDapan || qObj.anh_dapan || qObj.image_dapan || "";
            if (typeof raw !== "string") return null;

            const imgName = raw.trim();
            if (imgName === "" || imgName.toUpperCase() === "NULL" || imgName === "undefined") return null;

            const driveMatch = imgName.match(/[-\w]{25,}/);
            if (imgName.includes("drive.google.com") && driveMatch) {
                return "https://drive.google.com/thumbnail?id=" + driveMatch[0] + "&sz=w1200";
            }
            if (!imgName.includes(".") && !imgName.includes("/") && imgName.length >= 25) {
                return "https://drive.google.com/thumbnail?id=" + imgName + "&sz=w1200";
            }
            if (imgName.startsWith("http://") || imgName.startsWith("https://")) {
                return imgName;
            }
            return "../../img/vong1_chung/" + imgName;
        }

        // Tự động nhận diện nhánh câu hỏi và nhánh trạng thái trên Firebase
        function parseRoundData(data) {
            const raw = data || {};
            let bankObj = null;

            if (raw.question_bank && typeof raw.question_bank === 'object') {
                bankSubPath = "question_bank";
                bankObj = raw.question_bank;
            } else if (raw.danhSachCauHoi && typeof raw.danhSachCauHoi === 'object') {
                bankSubPath = "danhSachCauHoi";
                bankObj = raw.danhSachCauHoi;
            } else {
                bankSubPath = "";
                bankObj = {};
                Object.entries(raw).forEach(([k, v]) => {
                    if (v && typeof v === 'object' && !['match_state', 'config'].includes(k) && (v.cauhoi != null || v.noiDung != null || v.sttcau != null)) {
                        bankObj[k] = v;
                    }
                });
            }

            let ms = {};
            if (raw.match_state && typeof raw.match_state === 'object') {
                stateSubPath = "match_state";
                ms = raw.match_state;
            } else if (bankSubPath === "question_bank") {
                stateSubPath = "match_state";
                ms = raw.match_state || raw;
            } else {
                stateSubPath = "";
                ms = raw;
            }

            return {
                entries: V1C.list(bankObj),
                activeId: ms.cauhoihientai != null ? String(ms.cauhoihientai).trim() : '',
                opened: ms.cauhoiopen ? String(ms.cauhoiopen).split(',').map(s => s.trim()).filter(Boolean) : []
            };
        }

        function getQuestionStt(fbKey, q) {
            if (q && q.sttcau != null && String(q.sttcau).trim() !== '') return String(q.sttcau).trim();
            if (q && q.id != null && String(q.id).trim() !== '') return String(q.id).trim();
            return String(fbKey);
        }

        function updateAdminTimerBtn() {
            const btn = document.getElementById('btn-timer-5s');
            if (!btn) return;
            if (!adminTimerEnd) {
                btn.classList.remove('running');
                btn.innerText = "⏱ BẮT ĐẦU 5S";
                return;
            }
            const dist = adminTimerEnd - Date.now();
            if (dist <= 0) {
                adminTimerEnd = null;
                btn.classList.remove('running');
                btn.innerText = "⏱ HẾT 5S (BẤM ĐỂ CHẠY LẠI)";
            } else {
                const sec = Math.ceil(dist / 1000);
                btn.classList.add('running');
                btn.innerText = `⏱ ĐANG ĐẾM: ${sec}S...`;
            }
        }

        function renderQuestions(entries) {
            const qList = document.getElementById('question-list');
            const navBox = document.getElementById('quick-nav');

            if (!entries.length) {
                setHTML(navBox, '');
                setHTML(qList, '<div style="text-align:center; padding: 20px; color: #666; font-style: italic;">Chưa có câu hỏi nào trên Firebase (vong1_chung).</div>');
                return;
            }

            let navHtml = '';
            let activeItemHtml = '';

            entries.forEach(([fbKey, q]) => {
                const stt = getQuestionStt(fbKey, q);
                const isServerActive = (serverActiveQuestion !== '' && stt === serverActiveQuestion);
                const isViewing = (currentSelectedQuestion !== null && stt === String(currentSelectedQuestion));
                const isOpened = openedQuestions.includes("cau" + stt) || openedQuestions.includes(stt);

                let circleClass = "q-circle";
                if (isServerActive) circleClass += " active";
                else if (isOpened) circleClass += " opened";

                navHtml += `<div class="${circleClass}" onclick="selectAndPlayQuestion('${esc(stt)}')" title="Phát Câu ${esc(stt)}">${esc(stt)}</div>`;

                if (isViewing) {
                    const dapanOpened = (Number(q.statusdapan) === 1 || q.statusdapan === true);
                    const btnDapAnText = dapanOpened ? "✔ Đã Mở Đáp Án Lên Màn Hình" : "Mở Đáp Án Lên Màn Hình";
                    const qText = q.cauhoi || q.noiDung || "(Nội dung trống)";
                    const dapAnThucTe = q.danan || q.dapan || q.dapAn || "Chưa có dữ liệu";
                    const qImgLink = resolveImageUrl(q) || "";
                    const ansImgLink = resolveAnswerImageUrl(q) || "";

                    let qMediaHtml = "";
                    if (qImgLink) {
                        qMediaHtml = `
                            <div class="q-media-admin">
                                <div class="q-media-label">🖼️ Ảnh câu hỏi:</div>
                                <img class="q-admin-img" src="${esc(qImgLink)}" onerror="this.outerHTML='<div class=\\'img-error-admin\\'>⚠️ Không tải được ảnh câu hỏi: ${esc(qImgLink)}</div>'">
                            </div>
                        `;
                    }

                    let ansMediaHtml = "";
                    if (ansImgLink) {
                        if (dapanOpened) {
                            ansMediaHtml = `
                                <div class="q-media-admin answer-media">
                                    <div class="q-media-label" style="color:#28a745;">🖼️ Ảnh đáp án (Đang hiển thị lên màn hình):</div>
                                    <img class="q-admin-img" src="${esc(ansImgLink)}" onerror="this.outerHTML='<div class=\\'img-error-admin\\'>⚠️ Không tải được ảnh đáp án: ${esc(ansImgLink)}</div>'">
                                </div>
                            `;
                        } else {
                            ansMediaHtml = `<div class="q-media-hint">🖼️ Câu này có đính kèm ảnh đáp án (sẽ hiển thị khi ấn "Mở Đáp Án Lên Màn Hình")</div>`;
                        }
                    }

                    activeItemHtml = `
                        <div class="q-item active">
                            <div class="q-title">Nội dung Câu hỏi ${esc(stt)}</div>
                            <div class="q-content">${esc(qText)}</div>
                            ${qMediaHtml}
                            <div class="q-answer-admin">
                                💡 Gợi ý đáp án (Dành cho Admin): ${esc(dapAnThucTe)}
                                ${ansMediaHtml}
                            </div>
                            <div class="q-actions">
                                <button id="btn-timer-5s" class="btn-timer-5s" onclick="startTimer5s()">⏱ BẮT ĐẦU 5S</button>
                                <button class="btn-dapan ${dapanOpened ? 'opened' : ''}" onclick="toggleAnswer('${esc(fbKey)}', ${dapanOpened ? 0 : 1})">
                                    ${btnDapAnText}
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            setHTML(navBox, navHtml);

            const finalQHtml = currentSelectedQuestion === null
                ? '<div style="text-align:center; padding: 20px; color: #666; font-style: italic; font-size: 1.1rem;">Vui lòng click vào số câu hỏi ở trên để phát nội dung lên màn hình.</div>'
                : (activeItemHtml || '<div style="text-align:center; padding: 20px; color: #dc3545;">Không tìm thấy nội dung câu hỏi đang chọn.</div>');

            setHTML(qList, finalQHtml);
            updateAdminTimerBtn();
        }

        async function pollOnce() {
            const v1 = await V1C.get("");

            const parsed = parseRoundData(v1);
            serverActiveQuestion = parsed.activeId;
            openedQuestions = parsed.opened;
            cachedQuestions = parsed.entries;

            // Nếu vừa mở/F5 trang mà server đang phát sẵn 1 câu -> tự chọn để Admin thấy ngay
            if (currentSelectedQuestion === null && serverActiveQuestion !== '') {
                currentSelectedQuestion = serverActiveQuestion;
            }

            renderQuestions(cachedQuestions);
            const st = document.getElementById('status-text');
            st.innerText = `Trạng thái: Đã đồng bộ Firebase thành công (${cachedQuestions.length} câu hỏi).`;
            st.style.color = "#28a745";
        }

        async function pollAdmin() {
            try {
                await pollOnce();
            } catch (e) {
                const st = document.getElementById('status-text');
                st.innerText = "Lỗi kết nối Firebase: " + e.message;
                st.style.color = "#dc3545";
            } finally {
                setTimeout(pollAdmin, 1000);
            }
        }

        async function startTimer5s() {
            if (stateBusy) return;
            stateBusy = true;
            try {
                await V1C.patch(stateSubPath, {
                    timerTrigger: Date.now(),
                    thoiGianKetThuc: 5000
                });
                adminTimerEnd = Date.now() + 5000;
                updateAdminTimerBtn();
            } catch (e) {
                alert("Lỗi bắt đầu đếm 5s: " + e.message);
            } finally {
                stateBusy = false;
            }
        }

        async function selectAndPlayQuestion(sttcau) {
            if (stateBusy) return;
            stateBusy = true;
            currentSelectedQuestion = String(sttcau);
            adminTimerEnd = null;
            try {
                const opened = openedQuestions.slice();
                const tag = "cau" + sttcau;
                if (!opened.includes(tag)) opened.push(tag);

                await V1C.patch(stateSubPath, {
                    cauhoihientai: String(sttcau),
                    cauhoiopen: opened.join(','),
                    timerTrigger: 0,
                    thoiGianKetThuc: 0
                });
                await pollOnce();
            } catch (e) {
                alert("Lỗi phát câu hỏi: " + e.message);
            } finally {
                stateBusy = false;
            }
        }

        async function closeQuestion() {
            if (stateBusy) return;
            stateBusy = true;
            adminTimerEnd = null;
            try {
                await V1C.patch(stateSubPath, {
                    cauhoihientai: "",
                    timerTrigger: 0,
                    thoiGianKetThuc: 0
                });
                currentSelectedQuestion = null;
                serverActiveQuestion = '';
                await pollOnce();
            } catch (e) {
                alert("Lỗi đóng câu hỏi: " + e.message);
            } finally {
                stateBusy = false;
            }
        }

        async function toggleAnswer(fbKey, targetStatus) {
            if (stateBusy) return;
            stateBusy = true;
            try {
                const itemPath = bankSubPath
                    ? (bankSubPath + "/" + encodeURIComponent(fbKey))
                    : encodeURIComponent(fbKey);
                await V1C.patch(itemPath, { statusdapan: targetStatus });

                // Khi mở đáp án -> tắt đồng hồ & âm thanh 5s bên Khán giả
                if (targetStatus === 1) {
                    adminTimerEnd = null;
                    await V1C.patch(stateSubPath, { timerTrigger: 0, thoiGianKetThuc: 0 });
                }
                await pollOnce();
            } catch (e) {
                alert("Lỗi cập nhật trạng thái đáp án: " + e.message);
            } finally {
                stateBusy = false;
            }
        }

        async function resetRound() {
            if (stateBusy) return;
            if (!confirm("Làm mới Vòng 1.1 sẽ XÓA TRẠNG THÁI các câu đã phát (cauhoiopen) và đóng toàn bộ đáp án. Bạn có chắc chắn?")) return;
            stateBusy = true;
            adminTimerEnd = null;
            try {
                const updates = {};
                const statePrefix = stateSubPath ? (stateSubPath + "/") : "";
                const bankPrefix = bankSubPath ? (bankSubPath + "/") : "";

                updates[statePrefix + "cauhoihientai"] = "";
                updates[statePrefix + "cauhoiopen"] = "";
                updates[statePrefix + "timerTrigger"] = 0;
                updates[statePrefix + "thoiGianKetThuc"] = 0;

                cachedQuestions.forEach(([fbKey]) => {
                    updates[bankPrefix + fbKey + "/statusdapan"] = 0;
                });

                await V1C.patch("", updates);
                currentSelectedQuestion = null;
                await pollOnce();
            } catch (e) {
                alert("Lỗi làm mới vòng chơi: " + e.message);
            } finally {
                stateBusy = false;
            }
        }

        window.onload = function() {
            pollAdmin();
            setInterval(updateAdminTimerBtn, 100);
        };
    </script>
</body>
</html>
