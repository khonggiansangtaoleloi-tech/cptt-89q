<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympia - Màn Hình Khán Giả Tổng Hợp</title>
    <style>
        /* ================= BASE STYLES ================= */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #061138 0%, #010414 100%); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* ================= MAIN MENU ================= */
        /* Giảm 20% kích thước logo và margin */
        .logo-container { width: 96px; height: 96px; border-radius: 50%; border: 2.5px solid #f2c94c; box-shadow: 0 0 24px rgba(242, 201, 76, 0.6); overflow: hidden; margin-bottom: 16px; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Giảm 20% font-size và margin */
        .main-header h1 { color: #ffffff; font-size: 3.2rem; margin: 0 0 32px 0; text-transform: uppercase; text-shadow: 0 0 16px rgba(255, 255, 255, 0.6); text-align: center;}
        
        /* Chuyển grid sang flex để bố cục 3 trên 2 dưới, giảm 20% gap */
        .menu-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 32px; 
            width: 95%; 
            max-width: 1000px; 
        }
        
        /* Cấu hình chiều rộng 1/3 hàng và giảm 20% padding, border-radius */
        .menu-item { 
            width: calc(33.333% - 22px); 
            box-sizing: border-box;
            text-decoration: none; 
            color: white; 
            background: rgba(21, 50, 128, 0.2); 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            border-radius: 16px; 
            padding: 40px 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: all 0.3s; 
            cursor: pointer; 
            backdrop-filter: blur(5px);
        }
        
        .menu-item:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(255, 255, 255, 0.2); }
        .v1 { border-color: #007bff; } 
        .v2 { border-color: #fd7e14; } 
        .v3 { border-color: #6f42c1; } 
        .v4 { border-color: #dc3545; }
        
        /* Giảm 20% font-size */
        .round-name { font-size: 0.96rem; color: #a0b0d0; text-transform: uppercase; margin-bottom: 8px; }
        .round-title { font-size: 2rem; font-weight: bold; text-align: center; }

        /* Tối ưu cho thiết bị di động (tương ứng giảm 20% cho responsive) */
        @media screen and (max-width: 900px) {
            .menu-item { width: calc(50% - 16px); } /* Về 2 cột trên tablet */
        }
        
        @media screen and (max-width: 768px) {
            .menu-grid { flex-direction: column; align-items: center; gap: 16px;}
            .menu-item { width: 100%; max-width: 400px; padding: 24px 12px; }
            .main-header h1 { font-size: 2rem; margin-bottom: 16px;}
            .logo-container { width: 64px; height: 64px; }
            .round-title { font-size: 1.44rem; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://media.leloipt.edu.vn/Media/30_TH1041/Images/footer-logo-leloi83f2a8da-5-e.png" alt="Logo">
    </div>
    
    <div class="main-header">
        <h1>MÀN HÌNH KHÁN GIẢ</h1>
    </div>
    
    <!-- Lưới Flexbox: Tự động xếp 3 thẻ hàng 1, tràn 2 thẻ xuống hàng 2 và căn giữa -->
    <div class="menu-grid">
         <a href="vong1_rieng/" class="menu-item v1">
            <span class="round-name">Vòng 1 Riêng</span>
            <span class="round-title">KHỞI ĐỘNG RIÊNG</span>
        </a>
        <a href="vong1_chung/" class="menu-item v1">
            <span class="round-name">Vòng 1 Chung</span>
            <span class="round-title">KHỞI ĐỘNG CHUNG</span>
        </a>
        <a href="vong2/" class="menu-item v2">
            <span class="round-name">Vòng 2</span>
            <span class="round-title">VƯỢT CHƯỚNG NGẠI VẬT</span>
        </a>
        
        <a href="vong3/" class="menu-item v3">
            <span class="round-name">Vòng 3</span>
            <span class="round-title">TĂNG TỐC</span>
        </a>
        <a href="vong4/" class="menu-item v4">
            <span class="round-name">Vòng 4</span>
            <span class="round-title">VỀ ĐÍCH</span>
        </a>
    </div>

</body>
</html>
